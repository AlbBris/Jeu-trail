<!doctype html>
<html lang="fr">
<head>

<style>
:root{color-scheme:dark;--lime:#d2f46c;--cream:#fff8e7;--ink:#10231f;--glass:rgba(10,33,30,.91);--line:rgba(255,255,255,.18);font-family:ui-sans-serif,-apple-system,system-ui,Segoe UI,sans-serif; -webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#081b19;color:var(--cream);overscroll-behavior:none}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--lime);outline-offset:3px}button:disabled{opacity:.38;cursor:not-allowed}#app{height:100dvh;min-height:540px;max-width:590px;margin:0 auto;position:relative;overflow:hidden;isolation:isolate;background:#6a997a;box-shadow:0 0 70px #000b}canvas{width:100%;height:100%;display:block;touch-action:none}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,19,21,.65),transparent 28%,transparent 62%,rgba(3,19,21,.58));z-index:1}#mast{position:absolute;top:max(11px,env(safe-area-inset-top));left:14px;right:14px;z-index:4;display:flex;justify-content:space-between;gap:9px;align-items:flex-start}.logo{font-size:11px;font-weight:1000;letter-spacing:1.5px;line-height:1.12;text-shadow:0 2px 7px #000a}.logo b{display:block;font-size:21px;color:var(--lime);letter-spacing:.35px}.version{font-size:10px;color:#faf9e9;border:1px solid #ffffff45;border-radius:6px;padding:2px 5px;vertical-align:middle}.coinpill{background:rgba(11,36,33,.81);border:1px solid #ffffff37;border-radius:13px;padding:9px 12px;font-weight:950;font-size:14px;white-space:nowrap;backdrop-filter:blur(10px)}
#hud{z-index:4;position:absolute;top:74px;left:14px;right:14px;display:none;pointer-events:none}#hud.active{display:block}.hudtitle{display:flex;align-items:center;justify-content:space-between;gap:7px;font-weight:950;font-size:11px;text-shadow:0 2px 6px #000d}.bar{height:7px;background:#0c2824cf;border:1px solid #ffffff75;border-radius:20px;margin-top:8px;overflow:hidden}.bar b{display:block;width:0;height:100%;background:linear-gradient(90deg,#6aecd0,#d3f46a)}.hudrow{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:8px;font-size:13px;font-weight:950;text-shadow:0 1px 5px #000e}.meter{width:100px;max-width:28vw;height:8px;overflow:hidden;border-radius:8px;border:1px solid #fff8;background:#15251e}.meter b{display:block;height:100%;width:100%;background:#71edc4}.pause{pointer-events:auto;color:#fff;background:#0c2824bb;border:1px solid #fff6;border-radius:11px;width:35px;height:35px;font-size:17px}.routehint{margin-top:9px;text-align:center;font-size:10px;text-shadow:0 2px 9px #000;font-weight:1000;letter-spacing:.5px;color:#f4ffad}
#panel{position:absolute;inset:0;padding:70px 17px max(17px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;z-index:3;pointer-events:none}#panel.hide{display:none}.paper{pointer-events:auto;width:100%;max-height:min(80dvh,730px);overflow:auto;overscroll-behavior:contain;background:linear-gradient(147deg,rgba(16,45,40,.97),rgba(9,26,29,.98));border:1px solid #ffffff46;box-shadow:0 18px 60px #0008;border-radius:25px;padding:20px;backdrop-filter:blur(13px)}.eyebrow{color:#a9eac7;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:950}.paper h1{font-size:clamp(30px,8vw,43px);line-height:.96;letter-spacing:-1.4px;margin:7px 0 12px}.paper h2{font-size:27px;margin:6px 0 10px;letter-spacing:-1px}.paper p{font-size:13px;color:#d7e5df;line-height:1.55;margin:8px 0 14px}.accent{color:var(--lime)}.btn{background:var(--lime);color:#19291d;border:0;border-radius:14px;min-height:47px;padding:11px 14px;font-size:14px;font-weight:1000;box-shadow:0 4px 0 #819d43}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #819d43}.btn.alt{color:#f1f9f2;background:#284640;border:1px solid #ffffff23;box-shadow:none}.btn.out{background:transparent;color:#e3f0e5;border:1px solid #ffffff50;box-shadow:none}.full{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.stats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.stat{background:#ffffff13;border:1px solid #ffffff25;border-radius:9px;padding:7px 9px;font-size:11px}.course,.item{border:1px solid #ffffff29;background:#ffffff0b;border-radius:14px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px}.course{cursor:pointer}.course.selected{border-color:var(--lime);background:#ddff7220}.course .emoji,.item .emoji{font-size:24px}.course strong,.item strong{font-size:13px}.course small,.item small{display:block;font-size:11px;color:#c6d4d0;line-height:1.35;margin-top:3px}.course .tail{margin-left:auto;font-size:10px;font-weight:950;color:var(--lime)}.item{display:grid;grid-template-columns:32px 1fr auto}.item button{padding:8px;border:0;background:var(--lime);border-radius:10px;font-weight:900;font-size:11px;min-width:57px}.tip{font-size:12px;padding:11px;background:#d8fac40b;border:1px dashed #b5e5a95e;border-radius:11px;line-height:1.65;color:#d3e8d9}.muted{font-size:11px!important;color:#a5bcb5!important}
#controls{position:absolute;bottom:max(17px,env(safe-area-inset-bottom));left:14px;right:14px;z-index:5;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;gap:12px}#controls.active{display:flex}.controlbox{display:flex;gap:9px}.ctl{pointer-events:auto;background:rgba(13,42,39,.83);color:#fff;border:1px solid #ffffff85;min-height:65px;min-width:65px;padding:8px 12px;border-radius:17px;font-size:25px;font-weight:1000;user-select:none;touch-action:none;box-shadow:0 8px 20px #0005;backdrop-filter:blur(8px)}.ctl small{font-size:9px;display:block;letter-spacing:.6px}.ctl:active,.ctl.pressed{background:#c7f36e;color:#11221a}.ctl.boost{background:rgba(195,104,45,.9)}
#toast{position:absolute;z-index:8;left:50%;top:22%;transform:translate(-50%,-10px);min-width:170px;max-width:88%;padding:10px 13px;background:#112f2adf;border:1px solid #d6fca478;border-radius:12px;font-size:12px;font-weight:950;text-align:center;text-shadow:0 1px 3px #0006;white-space:normal;opacity:0;pointer-events:none;transition:.22s}#toast.show{opacity:1;transform:translate(-50%,0)}#modal{position:absolute;inset:0;z-index:9;background:#061717c1;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:17px}#modal.active{display:flex}.dialog{width:100%;max-width:420px;background:#13322e;border:1px solid #ffffff45;padding:24px;border-radius:23px;box-shadow:0 16px 45px #0008;text-align:center}.dialog h2{font-size:28px;letter-spacing:-1px}.dialog p{font-size:13px;line-height:1.5;color:#c9dbd3}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}.results div{padding:9px 4px;border:1px solid #ffffff28;background:#ffffff10;border-radius:10px}.results b{display:block;color:var(--lime);font-size:23px}.results small{font-size:10px;color:#d2e1dd}
@media(max-height:760px){.ctl{min-height:55px;min-width:55px;font-size:20px}.paper{padding:15px}.paper h1{font-size:32px}#panel{padding-bottom:10px}.routehint{display:none}}
@media(min-width:790px){body:before{position:fixed;content:'TRAIL CHAOS  /  EXPLORER';color:#c9f26a;top:35%;right:calc(50% + 360px);font-size:22px;font-weight:1000;letter-spacing:1px}}
</style>
</head>
<body>
<div id="app">
<canvas id="game" aria-label="Trail Chaos Explorer, jeu de course sur sentier en vue trois quarts"></canvas>
<div id="shade"></div>
<div id="mast"><div class="logo">TRAIL CHAOS <b>EXPLORER <span class="version">V3.0</span></b></div><span class="coinpill">🟡 <span id="bank">0</span></span></div>
<div id="hud"><div class="hudtitle"><span id="courseName">FORÊT DES RACINES</span><span id="distance">0 / 8 km</span></div><div class="bar"><b id="progress"></b></div><div class="hudrow"><span id="hearts">❤️❤️❤️</span><span>⚡ <span class="meter" style="display:inline-block;vertical-align:middle"><b id="energy"></b></span></span><span id="wallet">🟡 0</span><button id="pause" class="pause" aria-label="Pause">Ⅱ</button></div><div class="routehint" id="routehint">← TRAJECTOIRE LIBRE →</div></div>
<main id="panel"></main>
<div id="controls"><div class="controlbox"><button class="ctl" id="left" aria-label="Tourner à gauche">◀<small>GAUCHE</small></button><button class="ctl" id="right" aria-label="Tourner à droite">▶<small>DROITE</small></button></div><div class="controlbox"><button class="ctl" id="jump" aria-label="Sauter">↑<small>SAUTER</small></button><button class="ctl boost" id="boost" aria-label="Accélérer">⚡<small>SPRINT</small></button></div></div>
<div id="toast"></div><div id="modal"></div>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d');
const COURSES=[{id:'forest',name:'Forêt des Racines',emoji:'🌲',km:8,length:780,mode:'forest',difficulty:1,desc:'Sous-bois, ruisseaux et raccourcis boueux'},{id:'crest',name:'Crêtes du Vent',emoji:'⛰️',km:21,length:1250,mode:'mountain',difficulty:2,desc:'Alpages, pierriers et passages techniques'},{id:'night',name:'Ultra Nocturne',emoji:'🌙',km:45,length:1730,mode:'night',difficulty:3,desc:'Forêt nocturne, balises et frontale'}];
const SHOP=[{id:'shoes',emoji:'👟',name:'Chaussures de trail',sub:['Semelles du dimanche','Crampons sérieux','Accroche de bouquetin','Adhérence de légende'],prices:[0,35,90,170],effect:'Plus de cœurs pour affronter les rochers'},{id:'vest',emoji:'🎒',name:'Gilet d’hydratation',sub:['Poches imaginaires','Deux flasques','Ravito premium','Autonomie d’ultra'],prices:[0,30,75,145],effect:'Réduit la fatigue sur le parcours'},{id:'gel',emoji:'🍯',name:'Nutrition',sub:['Banane douteuse','Gel classique','Carburant de champion','Turbo ravito'],prices:[0,25,65,125],effect:'Ravitaillements plus efficaces'},{id:'lamp',emoji:'🔦',name:'Frontale',sub:['Lampe de poche','LED correcte','Pleine puissance','Phare de stade'],prices:[0,25,60,115],effect:'Plus grande visibilité sur les trails de nuit'}];
const defaults={coins:0,levels:{shoes:0,vest:0,gel:0,lamp:0},unlocked:0,wins:0,best:{},sound:false};
let stored=null;try{stored=JSON.parse(localStorage.getItem('trail-chaos-runner-v2')||'null')}catch(e){}
let profile={...defaults,...(stored&&typeof stored==='object'?stored:{}),levels:{...defaults.levels,...(stored?.levels||{})}};
const save=()=>{try{localStorage.setItem('trail-chaos-runner-v2',JSON.stringify(profile))}catch(e){}};
let W=390,H=820,DPR=1,last=0,sceneTime=0,screen='home',selected=0,run=null,toastTimer=0;
const keys={left:false,right:false,boost:false},tap={active:false,lastX:0},ease=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fract=v=>v-Math.floor(v);const hash=(a,b=0)=>fract(Math.sin(a*127.18+b*312.7+42.19)*43758.5453);
const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
function showToast(txt){const el=$('#toast');el.textContent=txt;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1550)}
function display(html){$('#panel').innerHTML=`<section class="paper">${html}</section>`;$('#panel').classList.remove('hide');$('#hud').classList.remove('active');$('#controls').classList.remove('active');$('#modal').classList.remove('active');$('#bank').textContent=fmt(profile.coins)}
function nav(target){screen=target; if(target==='home')home();else if(target==='courses')courses();else if(target==='shop')shop();else help()}
function home(){let c=COURSES[selected];display(`<span class="eyebrow">🏁 Nouvelle aventure · vue 3/4</span><h1>LE TRAIL.<br><span class="accent">TON CHEMIN.</span><br>TES CHOIX.</h1><p>Oublie les trois couloirs : dirige ton traileur sur un sentier sinueux. Choisis entre voie technique et passage roulant, saute les obstacles et gère ton effort.</p><div class="stats"><span class="stat">🏆 ${profile.wins} arrivée(s)</span><span class="stat">👟 Niveau ${profile.levels.shoes+1}</span><span class="stat">🟡 ${fmt(profile.coins)} pièces</span></div><div class="course selected" id="pick"><span class="emoji">${c.emoji}</span><span><strong>${c.name}</strong><small>${c.km} km · ${c.desc}</small></span><span class="tail">CHANGER ›</span></div><button class="btn full" id="play">▶ PARTIR SUR LE SENTIER</button><div class="actions"><button class="btn alt" id="shop">🎒 Boutique</button><button class="btn alt" id="help">🎮 Commandes</button></div><p class="muted" style="text-align:center;margin-bottom:0">La boutique et tes pièces V2 sont conservées.</p><a class="btn out full" href="./runner-v28.html" style="display:block;text-align:center;text-decoration:none;margin-top:11px;min-height:35px;padding:8px">⚡ Rejouer au mode arcade V2.8</a>`);$('#pick').onclick=()=>nav('courses');$('#play').onclick=begin;$('#shop').onclick=()=>nav('shop');$('#help').onclick=()=>nav('help')}
function courses(){display(`<span class="eyebrow">🗺️ Choix du terrain</span><h2>Les parcours</h2><p>Trois terrains vraiment différents. Termine une course pour débloquer la suivante.</p>${COURSES.map((c,i)=>`<div class="course ${selected===i?'selected':''}" data-course="${i}" style="opacity:${i>profile.unlocked?.52:1}"><span class="emoji">${i>profile.unlocked?'🔒':c.emoji}</span><span><strong>${c.name}</strong><small>${c.km} km · ${c.desc}</small></span><span class="tail">${i>profile.unlocked?'VERROUILLÉ':selected===i?'✓ CHOISI':'CHOISIR'}</span></div>`).join('')}<div class="actions"><button class="btn alt" id="back">← Retour</button><button class="btn" id="go">▶ Courir</button></div>`);document.querySelectorAll('[data-course]').forEach(x=>x.onclick=()=>{let i=+x.dataset.course;if(i>profile.unlocked){showToast('Termine le parcours précédent 🔒');return}selected=i;courses()});$('#back').onclick=()=>nav('home');$('#go').onclick=begin}
function shop(){display(`<span class="eyebrow">🎒 Le matériel compte</span><h2>Boutique <span class="accent">🟡 ${fmt(profile.coins)}</span></h2><p>Les améliorations restent celles de ta progression actuelle et fonctionnent aussi dans cette nouvelle version.</p>${SHOP.map(g=>{const lvl=profile.levels[g.id],cost=g.prices[lvl+1],max=lvl>=3;return `<div class="item"><span class="emoji">${g.emoji}</span><span><strong>${g.name} <span class="accent">${lvl+1}/4</span></strong><small>${g.sub[lvl]} · ${g.effect}</small></span><button data-buy="${g.id}" ${max||profile.coins<cost?'disabled':''}>${max?'MAX':'🟡 '+cost}</button></div>`}).join('')}<button class="btn alt full" id="back">← Camp de base</button>`);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const g=SHOP.find(x=>x.id===b.dataset.buy),l=profile.levels[g.id],cost=g.prices[l+1];if(l>=3||profile.coins<cost)return;profile.coins-=cost;profile.levels[g.id]++;save();shop();showToast('Équipement amélioré !')});$('#back').onclick=()=>nav('home')}
function help(){display(`<span class="eyebrow">🎮 Comment jouer</span><h2>Maîtrise ta trajectoire</h2><div class="tip"><b>📱 Sur téléphone</b><br>Maintiens ◀ / ▶ pour diriger librement le coureur, ou glisse horizontalement directement sur le sentier.<br>↑ pour sauter les troncs et ruisseaux.<br>⚡ pour sprinter, mais attention à l'énergie !<br><br><b>⌨️ Sur ordinateur</b><br>← → ou A / D · Espace pour sauter · Maj pour sprinter · P pour pause.</div><div class="stats"><span class="stat">🪨 Évite les pierres</span><span class="stat">🪵 Saute les troncs</span><span class="stat">🟫 Évite la boue</span><span class="stat">🌲 Reste sur le sentier</span></div><p>À l'embranchement, le côté gauche est technique avec davantage de pièces ; le côté droit est plus roulant et plus sûr. Sortir du sentier te ralentit et fatigue ton coureur.</p><button class="btn full" id="back">C'est parti !</button>`);$('#back').onclick=()=>nav('home')}
// --- Terrain et embranchements : toutes les coordonnées sont en unités de monde, sans couloirs imposés. ---
function trackX(z,c=COURSES[selected]){return 10*Math.sin(z*.012+c.difficulty*.7)+5.5*Math.sin(z*.028-1)+3*Math.sin(z*.004+2)}
function elevation(z,c=COURSES[selected]){return 3.2*Math.sin(z*.016)+1.5*Math.sin(z*.044+1)+(c.mode==='mountain'?4*Math.sin(z*.008):0)}
function forks(c){return [c.length*.24,c.length*.59].map((start,i)=>({start,len:c.mode==='forest'?116:150,i}))}
function forkAt(z,c=COURSES[selected]){for(const f of forks(c))if(z>=f.start&&z<=f.start+f.len)return {...f,amount:Math.pow(Math.sin(Math.PI*(z-f.start)/f.len),.8),left:-10,right:10};return null}
function branchCentres(z,c=COURSES[selected]){const f=forkAt(z,c),center=trackX(z,c);if(!f)return [{x:center,width:8.2,branch:0}];return [{x:center-10*f.amount,width:5.2,branch:-1},{x:center+10*f.amount,width:5.2,branch:1}]}
function closestTrail(x,z,c=COURSES[selected]){const bs=branchCentres(z,c);let best=Infinity,chosen=0;for(const b of bs){const d=Math.abs(x-b.x)-b.width;if(d<best){best=d;chosen=b.branch}}return {outside:Math.max(0,best),branch:chosen}}
function biome(c,z){const t=z/c.length;if(c.mode==='forest')return t<.36?'forest':t<.7?'creek':'pines';if(c.mode==='mountain')return t<.38?'meadow':t<.71?'ridge':'summit';return t<.31?'dusk':t<.7?'night':'moon'}
function makeWorld(c){const objects=[];const rngSeed=c.difficulty*100;
  for(let i=0;i<Math.ceil(c.length/17);i++){let z=45+i*17+hash(i,rngSeed)*8;if(z>c.length-16)break;const bs=branchCentres(z,c),branch=bs.length===2?(hash(i,6)>.23?bs[0]:bs[1]):bs[0];let x=branch.x+(hash(i,8)-.5)*branch.width*1.35;
    const typeRoll=hash(i,5);const decor=biome(c,z);let type=typeRoll<.25?'rock':typeRoll<.47?'log':typeRoll<.67?'mud':typeRoll<.85?'root':'creek';if(c.mode==='mountain'&&type==='creek')type='rock';if(c.mode==='night'&&type==='creek')type='root';
    if(hash(i,3)>.17)objects.push({type,x,z,r:type==='rock'?2.15:2.3,done:false});
    if(hash(i,4)<.9){const coinBranch=bs.length===2?bs[0]:bs[0];for(let j=0;j<3;j++)objects.push({type:'coin',x:coinBranch.x+(hash(i+j,9)-.5)*2,z:z+8+j*5.3,r:1.8,done:false,value:bs.length===2?2:1})}
    if(i%12===5)objects.push({type:'drink',x:bs[bs.length-1].x,z:z+24,r:2,done:false});
  }
  const decorations=[];
  for(let i=0;i<Math.ceil(c.length/10);i++){const z=10+i*10; const center=trackX(z,c); const side=i%2?-1:1;let x=center+side*(13+hash(i,4)*21);const type=(biome(c,z)==='ridge'||biome(c,z)==='summit')?(i%3?'rock':'bush'):(i%6===0?'rock':i%4===0?'bush':'tree');decorations.push({x,z,type,k:i});}
  return {objects,decorations};
}
function begin(){const c=COURSES[selected],w=makeWorld(c);run={course:c,z:0,x:trackX(0,c),camX:trackX(0,c),energy:100,hearts:3+profile.levels.shoes,coins:0,elapsed:0,jump:0,inv:0,stumble:0,offroad:0,score:0,finished:false,paused:false,steps:0,objects:w.objects,decorations:w.decorations,branchSeen:-1};screen='run';$('#panel').classList.add('hide');$('#hud').classList.add('active');$('#controls').classList.add('active');$('#courseName').textContent=c.name.toUpperCase();updateHUD();showToast(c.emoji+' Le trail commence !');keys.left=keys.right=keys.boost=false}
function updateHUD(){if(!run)return;const c=run.course;$('#distance').textContent=`${(run.z/c.length*c.km).toFixed(1)} / ${c.km} km`;$('#progress').style.width=clamp(run.z/c.length*100,0,100)+'%';$('#hearts').textContent='❤️'.repeat(clamp(run.hearts,0,6));$('#energy').style.width=clamp(run.energy,0,100)+'%';$('#energy').style.background=run.energy<25?'#ff8f6e':'#71edc4';$('#wallet').textContent='🟡 '+fmt(run.coins);const f=forkAt(run.z+62,c);$('#routehint').textContent=f?'↖ TECHNIQUE + PIÈCES + VITESSE  |  ROULANT ↗':'← TRACE LIBRE · CHOISIS TON CHEMIN →'}
function jump(){if(!run||screen!=='run'||run.paused)return;if(run.jump<=0){run.jump=.85;showToast('↗ SAUT !')}}
function jumpHeight(){return run?.jump>0?Math.sin(Math.PI*(1-run.jump/.85))*26:0}
function hit(o){if(run.inv>0)return;run.hearts--;run.inv=1.3;run.stumble=.55;run.energy=Math.max(0,run.energy-8);showToast(({rock:'🪨 Ouille, le rocher !',log:'🪵 Genou contre tronc !',root:'🌿 Racines sournoises !',creek:'💦 Bain de pieds forcé !'}[o.type])||'Aïe !');if(run.hearts<=0)finish(false)}
function collect(o){o.done=true;if(o.type==='coin'){run.coins+=o.value||1;run.score+=10*(o.value||1);if(o.value===2&&run.coins%12<2)showToast('🟡 Bonus sentier technique ×2 !')}else{run.energy=clamp(run.energy+23+profile.levels.gel*15,0,100);showToast('🧃 Ravito — énergie récupérée !')}}
function update(dt){sceneTime+=dt;if(screen!=='run'||!run||run.paused||run.finished)return;let r=run,c=r.course;r.elapsed+=dt;r.jump=Math.max(0,r.jump-dt);r.inv=Math.max(0,r.inv-dt);r.stumble=Math.max(0,r.stumble-dt);
  const steer=(+keys.right- +keys.left);r.x+=steer*18*dt; // déplacement libre et continu
  const trail=closestTrail(r.x,r.z,c);r.offroad=trail.outside;const sprint=keys.boost&&r.energy>3;
  let speed=(17.5+c.difficulty)*(sprint?1.36:1)*(r.stumble>0?.65:1)*(r.energy<=0?.65:1)*(trail.outside>0?.66:1);
  const gradient=(elevation(r.z+6,c)-elevation(r.z-6,c))/12;if(gradient>0)speed*=1-Math.min(.18,gradient*.13);
  if(forkAt(r.z,c)&&trail.branch===-1)speed*=1.055; r.z+=speed*dt;
  r.energy=clamp(r.energy-dt*(sprint?1.6:.24)*(1-profile.levels.vest*.17)-Math.max(0,gradient)*dt*.28-(trail.outside>0?dt*(.8+Math.min(2,trail.outside*.17)):0),0,100);
  if(trail.outside>5&&r.steps%155===0)showToast('🌲 Hors sentier ! Reviens sur la trace');
  r.camX=ease(r.camX,r.x*.62+trackX(r.z+50,c)*.38,Math.min(1,dt*3.3));
  for(const o of r.objects){if(o.done||Math.abs(o.z-r.z)>3.2||Math.abs(o.x-r.x)>o.r+1.0)continue;if(o.type==='coin'||o.type==='drink'){collect(o)}else if(o.type==='mud'){o.done=true;if(jumpHeight()<10){r.energy=clamp(r.energy-12,0,100);r.stumble=.32;showToast('🟫 Bourbier ! Énergie -12')}}else if(o.type==='log'||o.type==='root'||o.type==='creek'){o.done=true;if(jumpHeight()<9)hit(o)}else{o.done=true;hit(o)}}
  const f=forkAt(r.z+75,c);if(f&&r.branchSeen!==f.i){r.branchSeen=f.i;showToast('↖ TECHNIQUE 🟡 · ROULANT ↗')}
  if(r.z>=c.length)finish(true);r.steps++;if(r.steps%4===0)updateHUD();
}
function finish(win){if(!run||run.finished)return;run.finished=true;screen='results';keys.left=keys.right=keys.boost=false;$('#hud').classList.remove('active');$('#controls').classList.remove('active');const r=run,c=r.course,earned=r.coins+(win?15+c.difficulty*20:0);profile.coins+=earned;if(win){profile.wins++;profile.unlocked=Math.max(profile.unlocked,Math.min(2,selected+1));const b=profile.best[c.id];if(!b||r.elapsed<b.time)profile.best[c.id]={time:r.elapsed,coins:r.coins}}save();$('#bank').textContent=fmt(profile.coins);
  $('#modal').classList.add('active');$('#modal').innerHTML=`<div class="dialog"><div style="font-size:54px">${win?'🏆':'🩹'}</div><span class="eyebrow">${win?'Course terminée !':'Abandon technique'}</span><h2>${win?'TRAIL TERMINÉ':'QUADRIS EN PLS'}</h2><p>${win?'La meilleure trajectoire, c’est celle qui mène au ravito.':'Les montagnes seront encore là demain. Tes pièces aussi.'}</p><div class="results"><div><b>${(r.z/c.length*c.km).toFixed(1)}</b><small>km</small></div><div><b>${earned}</b><small>pièces gagnées</small></div><div><b>${Math.floor(r.elapsed/60)}:${String(Math.floor(r.elapsed%60)).padStart(2,'0')}</b><small>chrono arcade</small></div></div><div class="actions"><button class="btn alt" id="resShop">🎒 Boutique</button><button class="btn" id="again">↻ Rejouer</button></div><button class="btn out full" id="resHome" style="margin-top:10px">Retour au camp</button></div>`;$('#resShop').onclick=()=>nav('shop');$('#again').onclick=begin;$('#resHome').onclick=()=>nav('home')}
function pause(){if(!run||screen!=='run')return;run.paused=!run.paused;keys.left=keys.right=keys.boost=false;$('#modal').classList.toggle('active',run.paused);if(run.paused){$('#modal').innerHTML=`<div class="dialog"><div style="font-size:48px">⏸️</div><h2>Pause au sommet</h2><p>« C’est plat jusqu’à l’arrivée. » — quelqu’un qui n’a manifestement jamais couru ce trail.</p><button class="btn full" id="resume">▶ Reprendre</button><button class="btn alt full" id="quit" style="margin-top:10px">Abandonner et garder mes pièces</button></div>`;$('#resume').onclick=pause;$('#quit').onclick=()=>finish(false)}}
// --- Rendu en perspective trois-quarts avec caméra suiveuse et relief ---
const rgb=(r,g,b,a=1)=>`rgba(${r},${g},${b},${a})`;
function palette(c,z){const b=biome(c,z);return {
 forest:{sky:['#8bc5cf','#e0dcb1'],ground:'#578765',path:'#a08360',edge:'#ccaf88',trees:['#285b44','#3b7250','#214a3b'],haze:'#e1e4cd'},
 creek:{sky:['#9cd3d7','#e9e1b7'],ground:'#539077',path:'#987750',edge:'#cbb588',trees:['#28634c','#3b7961','#205445'],haze:'#dfece4'},
 pines:{sky:['#81b6c3','#bcd7c1'],ground:'#3b7257',path:'#8b684a',edge:'#caa781',trees:['#194b3d','#245c44','#376d50'],haze:'#c8ded2'},
 meadow:{sky:['#82c8d6','#dbebd5'],ground:'#80a56b',path:'#a68d68',edge:'#dfc49d',trees:['#4e7d5b','#668d62','#8aaa78'],haze:'#dde9d4'},
 ridge:{sky:['#79b5d0','#d7d6c2'],ground:'#89947f',path:'#93856f',edge:'#d6c9ae',trees:['#62735c','#788369','#8c8d72'],haze:'#dce3da'},
 summit:{sky:['#efb078','#f3dbad'],ground:'#8e8d69',path:'#b08b62',edge:'#f1d0a0',trees:['#6c755a','#758062','#9d9270'],haze:'#f9e3be'},
 dusk:{sky:['#526f99','#e2ac91'],ground:'#456d62',path:'#827165',edge:'#b4a49a',trees:['#2e5147','#3b6255','#214539'],haze:'#92a3a4'},
 night:{sky:['#0b1936','#2a5364'],ground:'#244b44',path:'#6d655a',edge:'#ada28d',trees:['#123f3c','#21554a','#163b3a'],haze:'#47616e'},
 moon:{sky:['#09152d','#27526c'],ground:'#213e43',path:'#756b5f',edge:'#c5b7a2',trees:['#14393d','#1e4c4a','#18373a'],haze:'#486173'}
}[b]}
function proj(wx,wz,wy=0){const c=run?.course||COURSES[selected],rz=run?.z||0,cx=run?.camX||trackX(0,c);const depth=wz-rz+26;if(depth<1||depth>202)return null;const t=clamp(1-depth/202,0,1.2);const u=Math.pow(t,1.53);const k=.8+17*Math.pow(t,1.55);const y=H*.235+H*.775*u-(wy-elevation(wz,c))*k*.63;return{x:W*.5+(wx-cx)*k,y,k,t,depth}}
function line(points,color,width=1){if(!points.length)return;ctx.beginPath();for(let i=0;i<points.length;i++)i?ctx.lineTo(points[i].x,points[i].y):ctx.moveTo(points[i].x,points[i].y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function drawSky(){const c=run?.course||COURSES[selected],z=run?.z||0,p=palette(c,z),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,p.sky[0]);g.addColorStop(.54,p.sky[1]);g.addColorStop(1,p.ground);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const night=c.mode==='night'&&z/c.length>.30;
  if(night){ctx.fillStyle='#e7f0e2';ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(W*.78,H*.12,24,0,7);ctx.fill();ctx.globalAlpha=1;for(let i=0;i<40;i++){ctx.fillStyle='#ffffff';ctx.globalAlpha=.16+.35*Math.abs(Math.sin(sceneTime*1.3+i));ctx.fillRect(hash(i,7)*W,hash(i,8)*H*.31,1.2,1.2)}ctx.globalAlpha=1}else{ctx.fillStyle='#fff7cf';ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(W*.76,H*.12,30,0,7);ctx.fill();ctx.globalAlpha=1}
  for(let j=0;j<3;j++){ctx.fillStyle=j===0?p.haze:j===1?'rgba(47,83,79,.25)':'rgba(36,75,66,.26)';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*(.38+j*.075));for(let i=0;i<=12;i++){const x=i*W/12;ctx.lineTo(x,H*(.32+j*.075)+Math.sin(i*1.86+j*3)*H*.06+(i%3===0?-H*.025:0))}ctx.lineTo(W,H);ctx.fill()}
  ctx.fillStyle=p.ground;ctx.fillRect(0,H*.61,W,H*.39);
  // Patches au sol en périphérie.
  for(let i=0;i<44;i++){const zz=(run?.z||0)-20+(i*13+(hash(i,8)*18)),xx=trackX(zz,c)+(i%2?-1:1)*(17+hash(i,2)*34);const q=proj(xx,zz);if(!q)continue;ctx.fillStyle=i%2?'rgba(17,67,42,.075)':'rgba(232,224,165,.09)';ctx.beginPath();ctx.ellipse(q.x,q.y,q.k*3.3,q.k*.85,0,0,7);ctx.fill()}
}
function drawTrail(){const c=run?.course||COURSES[selected],baseZ=run?.z||0,p=palette(c,baseZ);
  // Des bandes successives suivent les courbes et le relief du sentier : une ou deux bandes selon le fork.
  for(let z=baseZ+184;z>baseZ-27;z-=4){const zn=z-4;if(zn<baseZ-28)break;for(const side of [-1,1]){
    const a=branchCentres(z,c),b=branchCentres(zn,c);if(a.length===1&&side===1)continue;
    const t1=a.length===2?(side===-1?a[0]:a[1]):a[0],t2=b.length===2?(side===-1?b[0]:b[1]):b[0];
    const pts=[proj(t1.x-t1.width,z),proj(t1.x+t1.width,z),proj(t2.x+t2.width,zn),proj(t2.x-t2.width,zn)];if(pts.some(x=>!x))continue;
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let j=1;j<pts.length;j++)ctx.lineTo(pts[j].x,pts[j].y);ctx.closePath();ctx.fillStyle=(Math.floor(z/10)%2===0)?p.path:(c.mode==='mountain'?'#a08c73':c.mode==='night'?'#76695e':'#a98966');ctx.fill();
    const edgeLeft=[pts[0],pts[3]],edgeRight=[pts[1],pts[2]];line(edgeLeft,p.edge,Math.max(1,pts[2].k*.16));line(edgeRight,p.edge,Math.max(1,pts[2].k*.16));
    if(Math.floor(z/4)%5===0){const m1=proj(t1.x,z),m2=proj(t2.x,zn);if(m1&&m2)line([m1,m2],'rgba(255,239,200,.08)',Math.max(1,m2.k*.3))}
  }}
}
function drawTree(x,y,k,i,c){const size=clamp(k*6.3,4,125),p=palette(c,run?.z||0);ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(0,0,size*.31,size*.095,0,0,7);ctx.fill();ctx.fillStyle='#604b37';ctx.fillRect(-size*.06,-size*.42,size*.12,size*.43);for(let j=0;j<3;j++){const top=-size*(1.14-j*.32),r=size*(.32+j*.055);ctx.fillStyle=p.trees[(i+j)%3];ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(-r,top+size*.65);ctx.lineTo(r,top+size*.65);ctx.closePath();ctx.fill()}ctx.restore()}
function drawBoulder(x,y,k,i){const s=Math.max(3,k*2.2);ctx.fillStyle='rgba(6,29,24,.21)';ctx.beginPath();ctx.ellipse(x,y,s*1.05,s*.34,0,0,7);ctx.fill();ctx.fillStyle=i%2?'#82918c':'#717c78';ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x-s*.8,y-s*.65);ctx.lineTo(x-s*.1,y-s);ctx.lineTo(x+s*.68,y-s*.78);ctx.lineTo(x+s,y-s*.17);ctx.lineTo(x+s*.76,y+s*.06);ctx.closePath();ctx.fill();ctx.fillStyle='#a4b0a5';ctx.beginPath();ctx.moveTo(x-s*.78,y-s*.62);ctx.lineTo(x-s*.1,y-s);ctx.lineTo(x+s*.2,y-s*.65);ctx.lineTo(x-s*.22,y-s*.22);ctx.closePath();ctx.fill()}
function drawProps(){const c=run?.course||COURSES[selected];const props=run?.decorations||[];for(const o of props){const pp=proj(o.x,o.z);if(!pp||pp.y<0||pp.y>H+150)continue;if(o.type==='tree')drawTree(pp.x,pp.y,pp.k,o.k,c);else if(o.type==='rock')drawBoulder(pp.x,pp.y,pp.k*.9,o.k);else{ctx.fillStyle='#326e4b';ctx.beginPath();ctx.ellipse(pp.x,pp.y-pp.k*1.2,pp.k*1.4,pp.k*.7,0,0,7);ctx.fill()}}}
function drawCoinsAndHazards(){const r=run;if(!r)return;for(const o of r.objects){if(o.done)continue;const pp=proj(o.x,o.z);if(!pp||pp.y<0||pp.y>H+140)continue;const k=pp.k,x=pp.x,y=pp.y;if(o.type==='coin'){let sy=y-2.1*k-3*Math.sin(sceneTime*3+o.z);ctx.save();ctx.translate(x,sy);ctx.scale(.8+Math.abs(Math.cos(sceneTime*3+o.z))*.2,1);ctx.fillStyle='#f7cb48';ctx.strokeStyle='#fff6ae';ctx.lineWidth=Math.max(1,k*.22);ctx.beginPath();ctx.arc(0,0,Math.max(2.4,k*.96),0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#986223';ctx.font=`900 ${Math.max(7,k)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,0);ctx.restore();continue}
    if(o.type==='drink'){ctx.fillStyle='#80e4cf';ctx.beginPath();ctx.roundRect(x-k*.72,y-k*2.6,k*1.44,k*2.3,k*.32);ctx.fill();ctx.fillStyle='#e4fff8';ctx.beginPath();ctx.roundRect(x-k*.37,y-k*2.96,k*.74,k*.36,k*.15);ctx.fill();continue}
    if(o.type==='rock'){drawBoulder(x,y,k*1.35,7);continue}
    if(o.type==='mud'){ctx.fillStyle='#59402f';ctx.beginPath();ctx.ellipse(x,y,k*2.2,k*.66,0,0,7);ctx.fill();ctx.fillStyle='#946f48';ctx.beginPath();ctx.ellipse(x-k*.5,y-k*.13,k*.66,k*.24,0,0,7);ctx.fill();continue}
    if(o.type==='log'||o.type==='root'){ctx.save();ctx.translate(x,y-k*.6);ctx.rotate(.13);ctx.fillStyle=o.type==='log'?'#715034':'#4e4a30';ctx.beginPath();ctx.roundRect(-k*2.2,-k*.5,k*4.4,k*.8,k*.35);ctx.fill();ctx.fillStyle='#c59d6b';ctx.beginPath();ctx.ellipse(k*1.9,0,k*.3,k*.45,0,0,7);ctx.fill();ctx.restore();continue}
    if(o.type==='creek'){ctx.fillStyle='#36687b';ctx.beginPath();ctx.ellipse(x,y,k*2.4,k*.8,0,0,7);ctx.fill();ctx.strokeStyle='#a6e2e1';ctx.lineWidth=Math.max(1,k*.1);ctx.beginPath();ctx.moveTo(x-k*1.9,y-k*.15);ctx.quadraticCurveTo(x,y-k*.8,x+k*1.9,y-k*.15);ctx.stroke()}
  }}
function drawForkSigns(){const r=run;if(!r)return;for(const f of forks(r.course)){const dist=f.start-r.z;if(dist<5||dist>150)continue;const c=trackX(f.start,r.course),p=proj(c,f.start);if(!p)continue;let k=clamp(p.k,2,12);ctx.strokeStyle='#604a2c';ctx.lineWidth=Math.max(1,k*.3);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-k*8);ctx.stroke();ctx.fillStyle='#2b533f';ctx.beginPath();ctx.roundRect(p.x-k*7,p.y-k*10,k*14,k*4,k*.6);ctx.fill();ctx.fillStyle='#f9f2c9';ctx.font=`900 ${Math.max(7,k*1.25)}px sans-serif`;ctx.textAlign='center';ctx.fillText('← 🪙       🌿 →',p.x,p.y-k*7.2)}}
function drawRunner(){const r=run,c=r?.course||COURSES[selected],x=r?.x??trackX(0,c),z=r?.z||0,p=proj(x,z);if(!p)return;const k=clamp(p.k/12,0.7,1.5),j=jumpHeight();const phase=(r?.elapsed||sceneTime)*13.8,bounce=Math.sin(phase*2)*2.0;ctx.save();ctx.translate(p.x,p.y-j-bounce);ctx.scale(k,k);
  ctx.fillStyle='rgba(0,0,0,.33)';ctx.beginPath();ctx.ellipse(0,j+bounce+5,22,7,0,0,7);ctx.fill();
  const swing=Math.sin(phase)*11;
  function leg(side){const sx=side*6;ctx.lineWidth=7;ctx.strokeStyle='#203944';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,-21);ctx.lineTo(sx+swing*(side===1?1:-1)*.2,-7-Math.max(0,swing*side)*.15);ctx.lineTo(sx+swing*.25,5-Math.max(0,-swing*side)*.3);ctx.stroke();ctx.fillStyle='#e2eee6';ctx.beginPath();ctx.roundRect(sx+swing*.25-6,0-Math.max(0,-swing*side)*.3,12,6,3);ctx.fill()}
  leg(-1);leg(1);ctx.lineWidth=6;ctx.strokeStyle='#e4af8b';ctx.beginPath();ctx.moveTo(-15,-53);ctx.lineTo(-18-swing*.14,-32);ctx.moveTo(15,-53);ctx.lineTo(18+swing*.14,-32);ctx.stroke();ctx.fillStyle='#ed9559';ctx.beginPath();ctx.roundRect(-17,-61,34,37,9);ctx.fill();ctx.fillStyle='#315d63';ctx.beginPath();ctx.roundRect(-13,-58,26,29,9);ctx.fill();ctx.fillStyle='#79b4a1';ctx.beginPath();ctx.roundRect(-8,-54,16,22,5);ctx.fill();ctx.strokeStyle='#d1ef6c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-14,-58);ctx.lineTo(-14,-28);ctx.moveTo(14,-58);ctx.lineTo(14,-28);ctx.stroke();ctx.fillStyle='#e3af87';ctx.beginPath();ctx.arc(0,-68,11,0,7);ctx.fill();ctx.fillStyle='#a6d961';ctx.beginPath();ctx.roundRect(-14,-80,28,9,4);ctx.fill();ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);drawSky();drawTrail();drawProps();drawForkSigns();drawCoinsAndHazards();drawRunner();if(run?.inv>0&&Math.sin(sceneTime*24)>0){ctx.fillStyle='rgba(255,88,80,.10)';ctx.fillRect(0,0,W,H)}if((run?.course||COURSES[selected]).mode==='night'&&(run?.z||0)>COURSES[selected].length*.3){const lvl=profile.levels.lamp,x=run?proj(run.x,run.z)?.x||W*.5:W*.5,y=H*.78,gr=ctx.createRadialGradient(x,y,H*.1+lvl*14,x,y,H*.82);gr.addColorStop(0,'rgba(1,10,18,0)');gr.addColorStop(1,`rgba(0,4,15,${Math.max(.26,.69-lvl*.12)})`);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}}
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width||390;H=rect.height||800;DPR=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
function tick(time){if(!last)last=time;const dt=Math.min(.045,(time-last)/1000);last=time;if(!document.hidden)update(dt);render();requestAnimationFrame(tick)}
function attachHold(id,key){const el=$('#'+id);let pointer=null;el.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;keys[key]=true;el.classList.add('pressed');try{el.setPointerCapture(pointer)}catch(_){}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{pointer=null;keys[key]=false;el.classList.remove('pressed')})}
attachHold('left','left');attachHold('right','right');attachHold('boost','boost');$('#jump').onclick=jump;$('#pause').onclick=pause;
canvas.addEventListener('pointerdown',e=>{if(screen!=='run'||run?.paused)return;tap.active=true;tap.lastX=e.clientX;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!tap.active||screen!=='run'||!run||run.paused)return;const dx=clamp(e.clientX-tap.lastX,-65,65);run.x+=dx/Math.max(9,proj(run.x,run.z)?.k||11)*.95;tap.lastX=e.clientX});
canvas.addEventListener('pointerup',()=>tap.active=false);canvas.addEventListener('pointercancel',()=>tap.active=false);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','A','D','Shift','p','P','Escape'].includes(e.key)&&screen==='run'){e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key==='Shift')keys.boost=true;if((e.key==='ArrowUp'||e.key===' ')&&!e.repeat)jump();if((e.key==='p'||e.key==='P'||e.key==='Escape')&&!e.repeat)pause()}});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;if(e.key==='Shift')keys.boost=false});
window.addEventListener('blur',()=>{keys.left=keys.right=keys.boost=false;if(run&&screen==='run'&&!run.paused)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&screen==='run'&&!run.paused)pause()});window.addEventListener('resize',resize);
resize();nav('home');requestAnimationFrame(tick);
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
