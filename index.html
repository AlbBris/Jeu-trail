function formatTime(seconds){let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=Math.floor(seconds%60);return h?`${h} h ${String(m).padStart(2,'0')}`:`${m} min ${String(s).padStart(2,'0')}`}

function tierName(){return state.xp>=700?'Légende du ravito':state.xp>=440?'Chamois des bois':state.xp>=220?'Mangeur de D+':'Coureur du dimanche'}

function bar(value){return `<div class="stat-track"><div class="stat-fill ${value<=25?'low':value<=50?'mid':'good'}" style="width:${clamp(value)}%"></div></div>`}

function miniMods(d){const short={energy:'⚡',water:'💧',stomach:'🥨',morale:'🧠'};return Object.entries(d||{}).filter(([,n])=>n!==0).map(([k,v])=>`<span class="mod ${v>0?'pos':'neg'}">${short[k]} ${v>0?'+':''}${v}</span>`).join('')}

function courseCard(c){const locked=!unlocked(c);const record=state.records[c.id];return `<article class="card course-card"><div class="course-banner ${c.banner}"><span class="pill mini" style="position:relative;z-index:1;align-self:flex-start">${c.tag}</span><div style="font-size:12px;color:#e1eadf;position:relative;z-index:1">${c.weather==='pluie'?'🌧️ Pluie & boue':c.weather==='nuit'?'🌌 Départ nocturne':'☀️ Temps calme'}</div><div class="scene-emoji">${c.emoji}</div></div><div class="course-body"><h3>${c.name}</h3><div class="course-meta"><span>📏 ${c.distance} km</span><span>📈 ${c.climb} m D+</span><span>🎲 ${c.stages.length} décisions</span></div><p>${c.flavor}</p>${record?`<div class="rating">✓ Déjà terminée · Record ${formatTime(record.best)}</div>`:''}<div class="course-foot"><button class="btn btn-primary ${locked?'':''}" data-action="start" data-id="${c.id}" ${locked?'disabled':''}>${record?'Rejouer':'Prendre le départ'} →</button><div class="coin">🪙 +${c.reward}</div></div></div>${locked?`<div class="lockover"><div class="lockbox"><div style="font-size:29px">🔒</div><b>Course verrouillée</b><p>${c.unlock}</p></div></div>`:''}</article>`}
function coursesPage(){return `<section class="intro"><p class="eyebrow">LE CALENDRIER DES MAUVAISES IDÉES</p><h1>Choisis ta souffrance.</h1><p>Trois courses, trois ambiances et une seule certitude : quelqu’un va te mentir sur la distance restante.</p></section><div class="grid grid-3">${COURSES.map(courseCard).join('')}</div><div class="section-head"><div><h2>Ton matériel actuel</h2></div><button class="btn btn-sm btn-ghost" data-action="navigate" data-id="shop">Changer →</button></div><div class="loadout">${loadoutMini()}</div><div class="callout below">💡 <strong>Conseil du coach imaginaire :</strong> la grande course de nuit devient accessible après avoir terminé le trail de 21 km. Une bonne paire de chaussures change vraiment la donne.</div>`}
function shopPage(){let tabs=[['all','Tout voir'],['shoe','👟 Chaussures'],['bag','🎒 Hydratation'],['food','🍎 Nutrition'],['acc','🔦 Accessoires']];let selection=GEAR.filter(g=>state.shopTab==='all'||g.slot===state.shopTab);return `<section class="intro"><p class="eyebrow">LE MAGASIN DU MATÉRIEL INDISPENSABLE (OU PAS)</p><h1>La boutique du ravito.</h1><p>Achète du matériel avec les pièces gagnées en course. Un équipement peut réduire tes pertes à <strong>chaque tronçon</strong> : ça finit par faire une sacrée différence.</p></section><div class="row-between" style="margin-bottom:15px"><span class="pill strong">🪙 Budget : ${state.coins} pièces</span><span class="hint">✓ Les achats sont définitifs</span></div><div class="tabline">${tabs.map(([id,name])=>`<button class="tab ${state.shopTab===id?'active':''}" data-action="tab" data-id="${id}">${name}</button>`).join('')}</div><div class="shop-grid">${selection.map(g=>{let owned=state.owned.includes(g.id),active=state.equipped[g.slot]===g.id;return `<article class="card shop-item"><div class="shop-art">${g.icon}</div><div><div class="small-heading">${SLOT_NAMES[g.slot]}</div><h3>${g.name}</h3><p>${g.desc}</p><div class="item-effect">${g.effect}</div><div class="shop-meta"><button class="btn btn-sm ${active?'btn-ghost':owned?'btn-secondary':'btn-primary'}" ${active||!owned&&state.coins<g.price?'disabled':''} data-action="${owned?'equip':'buy'}" data-id="${g.id}">${active?'✓ Équipé':owned?'Équiper':`Acheter · ${g.price} 🪙`}</button>${!owned&&state.coins<g.price?'<small>Pièces insuffisantes</small>':''}</div></div></article>`}).join('')}</div><p class="disclaimer">Chaque catégorie accepte un seul équipement. Le matériel est figé au départ d’une course : impossible de changer de chaussures en pleine descente.</p>`}
function recordsPage(){let earned=ACHIEVEMENTS.filter(a=>a.check(state)).length;return `<section class="intro"><p class="eyebrow">LE MUSÉE DE TES SOUFFRANCES</p><h1>Palmarès & exploits.</h1><p>Des records, des badges et des souvenirs de ravitos sur lesquels on préfère ne pas revenir.</p></section><div class="grid grid-3"><div class="card"><div class="metric-emoji">🏅</div><div class="metric">${state.finishes}</div><div class="metric-label">Dossards terminés</div></div><div class="card"><div class="metric-emoji">⭐</div><div class="metric">${state.xp}</div><div class="metric-label">Points d’expérience</div></div><div class="card"><div class="metric-emoji">🏆</div><div class="metric">${earned}<span style="font-size:16px;color:var(--muted)"> / ${ACHIEVEMENTS.length}</span></div><div class="metric-label">Badges remportés</div></div></div><div class="section-head"><h2>Mes temps de référence</h2></div><div class="card" style="padding:4px 17px">${COURSES.map(c=>{let r=state.records[c.id];return `<div class="record-row"><div class="record-emoji">${c.emoji}</div><div><strong>${c.name}</strong><small>${c.distance} km · ${c.climb} m D+</small></div><div class="record-data"><b>${r?formatTime(r.best):'—'}</b><small>${r?`${r.count} arrivée${r.count>1?'s':''}`:'Pas encore fini'}</small></div></div>`}).join('')}</div><div class="section-head"><h2>Collection de badges</h2></div><div class="achievements">${ACHIEVEMENTS.map(a=>{let ok=a.check(state);return `<div class="achievement ${ok?'':'locked'}"><span>${ok?a.emoji:'🔒'}</span><b>${a.name}</b><small>${a.desc}</small></div>`}).join('')}</div><div class="below" style="margin-top:25px"><button class="btn btn-sm btn-danger" data-action="reset">Effacer ma progression</button></div>`}
function cumulative(c,i){let km=0,up=0;for(let n=0;n<i;n++){km+=c.stages[n].km;up+=c.stages[n].up}return {km:Math.round(km*10)/10,up}}
function rateCost(c,seg,loadout){let sh=gear(loadout.shoe),bag=gear(loadout.bag),food=gear(loadout.food),acc=gear(loadout.acc);let energy=Math.round(4.8+c.difficulty*1.9+seg.km*1.15+seg.up/75+ (seg.type==='descente'?0.5:0) -(sh.energySave||0) -(c.weather==='pluie'?(acc.rainEnergySave||0):0));let water=Math.round(4.4+c.difficulty*1.3+seg.km*1.15-(bag.waterSave||0));let stomach=Math.max(0,Math.round(3+c.difficulty*.65-(food.stomachSave||0)));let morale=Math.max(0,Math.round(1.5+c.difficulty*.6+(c.weather==='nuit'?2.6:0)+(c.weather==='pluie'?2.0:0) -(c.weather==='nuit'?(acc.nightMoraleSave||0):0)-(c.weather==='pluie'?(acc.rainMoraleSave||0):0)));return {energy:Math.max(2,energy),water:Math.max(2,water),stomach,morale}}
function elevation(c,index){let pts=[0];for(let i=0;i<c.stages.length;i++){let s=c.stages[i];pts.push(pts[pts.length-1]+Math.round(s.up/10)-(s.type==='descente'?29:s.type==='plat'?5:0))}let min=Math.min(...pts),max=Math.max(...pts),range=Math.max(10,max-min);const coords=pts.map((y,i)=>`${(i/(pts.length-1)*340+7).toFixed(1)},${(84-((y-min)/range)*58).toFixed(1)}`);let active=Math.max(0,Math.min(pts.length-1,index)),dot=coords[active].split(',');return `<svg viewBox="0 0 354 105" class="profile-graph" role="img" aria-label="Profil du parcours avec position actuelle"><defs><linearGradient id="chartgreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6f46b" stop-opacity=".29"/><stop offset="1" stop-color="#c6f46b" stop-opacity="0"/></linearGradient></defs><path d="M ${coords.join(' L ')} L347 99 L7 99 Z" fill="url(#chartgreen)"/><polyline points="${coords.join(' ')}" fill="none" stroke="#93bc7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${coords.slice(0,index+1).join(' ')}" fill="none" stroke="#d8ff75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${dot[0]}" cy="${dot[1]}" r="6.5" fill="#c6f46b" stroke="#10221c" stroke-width="3"/><text x="7" y="12" font-size="9" fill="#d6e2cf" font-weight="800">PROFIL APPROXIMATIF</text><text x="7" y="103" font-size="9" fill="#c5d7d4">DÉPART</text><text x="347" y="103" text-anchor="end" font-size="9" fill="#c5d7d4">ARRIVÉE</text></svg>`}
function racePage(){let r=state.race;if(!r)return home();let c=course(r.courseId),seg=c.stages[r.index],evt=EVENTS[seg.event],done=cumulative(c,r.index),cost=rateCost(c,seg,r.loadout),percent=100*done.km/c.distance;return `<div class="race-kicker"><span class="pill mini">🏃 DOSSARD #${String(r.number).padStart(3,'0')}</span><span class="pill mini">${c.weather==='nuit'?'🌙 Nuit':c.weather==='pluie'?'🌧️ Pluie':'☀️ Soleil'} · ${formatTime(r.seconds)}</span></div><h1 class="race-title">${c.name}</h1><p class="muted" style="margin-bottom:19px;font-size:14px">${c.subtitle}</p><div class="race-layout"><section class="card race-panel"><div class="row-between"><span class="small-heading">Progression</span><span style="font-size:13px;font-weight:900">${fmtKm(done.km)} / ${c.distance} km</span></div><div class="progress"><div class="progress-inner" style="width:${percent}%"></div></div><div class="progress-labels"><span>📈 ${done.up} / ${c.climb} m D+</span><span>Tronçon ${r.index+1} / ${c.stages.length}</span></div><div class="mobile-hud">${statsMeta.map(sm=>`<div class="hud-unit"><strong style="color:${r.stats[sm.key]<=25?'var(--red)':r.stats[sm.key]<=50?'var(--orange)':'var(--lime)'}">${sm.icon} ${r.stats[sm.key]}%</strong><small>${sm.label}</small></div>`).join('')}</div><div class="race-scene">${elevation(c,r.index)}</div>${r.lastReaction?`<div class="reaction">💬 ${r.lastReaction}</div>`:''}<div class="event"><div class="event-icon">${evt.emoji}</div><p class="eyebrow orange" style="margin-bottom:8px">ÉVÉNEMENT #${r.index+1}</p><h3>${evt.title}</h3><p>${evt.text}</p><div class="terrain-info"><span>${seg.type==='montée'?'↗️ Montée':seg.type==='descente'?'↘️ Descente':'➡️ Sentier'} · ${fmtKm(seg.km)} km</span><span>⛰ +${seg.up} m D+</span><span>⏱️ ~${formatTime(seg.km*c.pace)}</span></div><div class="cost-hint-inline">⛰️ <b>Effort du tronçon :</b> ⚡−${cost.energy} · 💧−${cost.water} · 🥨−${cost.stomach} · 🧠−${cost.morale}<br>Ces pertes s’ajoutent aux effets de ton choix.</div><div class="small-heading" style="margin-bottom:10px">Comment tu réagis ?</div><div class="decision-stack">${evt.options.map((o,i)=>`<button class="decision" data-action="choose" data-id="${i}"><span><span class="decision-title">${i+1}. ${o.label}</span><span class="decision-desc" style="display:block">${o.hint}</span></span><span class="decision-modifiers">${miniMods(o.d)}</span></button>`).join('')}</div></div></section><aside class="race-side"><div class="card"><div class="row-between"><span class="side-title">Ton état</span><span class="pill mini">💀 ${Math.min(...Object.values(r.stats))<=25?'Danger':'En course'}</span></div><div class="status-grid">${htmlStats(r.stats)}</div><div class="cost-note"><b style="color:var(--light)">🔋 Usure prévue du tronçon :</b><br>⚡ −${cost.energy} · 💧 −${cost.water} · 🥨 −${cost.stomach} · 🧠 −${cost.morale}<br><span style="color:#8ea5ad">Ces pertes s’ajoutent aux effets du choix.</span></div><div class="split-line"></div><div class="side-title">Le matériel te protège</div><div style="display:grid;gap:8px;margin-top:10px">${Object.values(r.loadout).map(id=>{let g=gear(id);return `<div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#c3d5d3"><span>${g.icon}</span><span>${g.name}</span></div>`}).join('')}</div></div><div class="card"><div class="side-title">Journal de course</div>${r.log.length?r.log.slice(-3).reverse().map(l=>`<div class="history-line">${l}</div>`).join(''):'<div class="history-line">Départ imminent. Les jambes sont encore optimistes.</div>'}<div class="race-actions"><button class="btn btn-sm btn-danger" data-action="quit">🏳️ Abandonner</button></div></div></aside></div>`}
function resultPage(){let o=state.lastResult;if(!o){state.screen='home';return home()}let c=course(o.courseId);let won=o.success;let text=won?o.stats.energy<=25?'Tu passes la ligne avec des jambes en flan, mais tu passes. Le public (trois bénévoles) est en délire.':o.stats.stomach<=25?'Tu termines malgré un estomac en grève. Respect, et bon courage pour le retour en voiture.':c.id==='night'?'45 bornes dans le noir. Tu as officiellement débloqué le droit de dire « plus jamais » jusqu’à lundi.':'Tu as survécu aux montées, à ton ego et aux conseils douteux. Chapeau !':o.reason;return `<div class="finished"><p class="eyebrow">${won?'MISSION ACCOMPLIE':'FIN DE L’AVENTURE'}</p><div class="finish-emoji">${won?'🏆':'🩹'}</div><h1>${won?'FINISHER !':'DNF… AÏE.'}</h1><p class="lead">${c.name} · ${fmtKm(o.distance)} / ${c.distance} km</p><div class="finish-quote">« ${text} »</div><div class="finish-summary"><div class="finish-stat"><b>${formatTime(o.seconds)}</b><span>Temps de course</span></div><div class="finish-stat"><b>${fmtKm(o.distance)} km</b><span>Distance parcourue</span></div><div class="finish-stat"><b>${won?'+'+o.reward+' 🪙':'0 🪙'}</b><span>Récompense</span></div></div>${won?`<p class="muted">⭐ +${o.xp} XP · ${o.newBest?'✨ Nouveau record personnel !':'Finisher confirmé !'}</p>`:`<p class="muted">Les courses perdues ne rapportent pas de pièces. Le ravito de consolation reste ouvert.</p>`}<div class="buttons" style="justify-content:center;margin-top:19px"><button class="btn btn-primary" data-action="navigate" data-id="courses">🏔️ Choisir une autre course</button><button class="btn btn-secondary" data-action="navigate" data-id="shop">🎒 Boutique</button><button class="btn btn-ghost" data-action="retry" data-id="${c.id}">↻ Réessayer</button></div></div>`}
function render(scroll=false){let root=el('app');root.innerHTML=header()+({home,courses:coursesPage,shop:shopPage,records:recordsPage,race:racePage,result:resultPage}[state.screen]||home)()+nav();save();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function toast(msg){const box=el('toast');box.textContent=msg;box.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),3000)}
function go(screen){if(state.race&&screen!=='race'){toast('Tu dois terminer ou abandonner ta course avant de partir.');return}state.screen=screen;render(true)}
function start(id){let c=course(id);if(!c||!unlocked(c)){toast('Cette course est encore verrouillée.');return}if(state.race){toast('Une course est déjà en cours.');return}let items=Object.values(state.equipped).map(gear),stat={energy:100,water:94,stomach:85,morale:88};for(let g of items){stat.morale=clamp(stat.morale+(g.startMorale||0));stat.stomach=clamp(stat.stomach+(g.startStomach||0))}state.race={courseId:c.id,index:0,stats:stat,seconds:0,log:[],lastReaction:'',loadout:{...state.equipped},number:state.finishes+1};state.lastResult=null;state.screen='race';render(true)}
function finish(success,reason='',distanceOverride=null){let r=state.race,c=course(r.courseId),progress=cumulative(c,r.index);let currentDistance=success?c.distance:(distanceOverride===null?progress.km:Math.round(distanceOverride*10)/10);let reward=success?c.reward+Math.round((r.stats.energy+r.stats.water+r.stats.stomach+r.stats.morale)/11):0;let xp=success?Math.round(c.distance*7):0;let previous=state.records[c.id];let newBest=success&&(!previous||r.seconds<previous.best);if(success){state.coins+=reward;state.xp+=xp;state.finishes++;state.km=Math.round((state.km+c.distance)*10)/10;if(r.stats.energy<=25)state.cheeseFinish=true;state.records[c.id]={best:previous?Math.min(previous.best,r.seconds):r.seconds,count:(previous?.count||0)+1}}state.lastResult={success,courseId:c.id,reason,seconds:r.seconds,distance:currentDistance,reward,xp,newBest,stats:{...r.stats}};state.race=null;state.screen='result';render(true)}
function choose(optionIndex){let r=state.race;if(!r)return;let c=course(r.courseId),seg=c.stages[r.index],event=EVENTS[seg.event],choice=event.options[optionIndex];if(!choice)return;let cost=rateCost(c,seg,r.loadout);for(const m of statsMeta){let k=m.key;r.stats[k]=clamp(r.stats[k]-(cost[k]||0)+(choice.d[k]||0))}r.seconds+=Math.max(30,Math.round(seg.km*c.pace+(seg.up/15)+choice.time));r.index+=1;r.lastReaction=choice.reply;r.log.push(`KM ${fmtKm(cumulative(c,r.index).km)} : ${choice.reply}`);let dead=statsMeta.find(s=>r.stats[s.key]===0);if(dead){let reasons={energy:'Les jambes ont officiellement fermé boutique. Un bénévole te propose un siège et du réconfort.',water:'Ton corps réclame de l’eau. Le ravito le plus proche gagne un visiteur imprévu.',stomach:'Ton estomac a voté l’abandon à l’unanimité. Le fromage était une erreur.',morale:'Le mental a quitté le groupe WhatsApp. Fin de course pour aujourd’hui.'};finish(false,reasons[dead.key],cumulative(c,r.index-1).km+seg.km*.65);return}if(r.index===c.stages.length){finish(true);return}render(true)}
function buy(id){let g=gear(id);if(!g||state.owned.includes(id))return;if(state.coins<g.price){toast('Pas assez de pièces. Va chercher un dossard !');return}state.coins-=g.price;state.owned.push(g.id);state.equipped[g.slot]=g.id;render();toast(`${g.icon} ${g.name} acheté et équipé !`)}
function equip(id){let g=gear(id);if(!g||!state.owned.includes(id))return;state.equipped[g.slot]=g.id;render();toast(`${g.icon} Équipement modifié !`)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;switch(action){case 'navigate':go(id);break;case 'start':start(id);break;case 'choose':choose(Number(id));break;case 'buy':buy(id);break;case 'equip':equip(id);break;case 'tab':state.shopTab=id;render();break;case 'retry':state.screen='courses';start(id);break;case 'quit':if(confirm('Abandonner cette course ? Les ravitos sont déjà rangés, et tu ne gagneras pas de pièces.')){let r=state.race;finish(false,'Tu as décidé d’écouter tes jambes. Une grande preuve de maturité… ou juste une envie de pizza.')}break;case 'reset':if(confirm('Effacer TOUTE ta progression, les records et le matériel ? Cette action est irréversible.')){state=initialState();render(true);toast('Nouvelle carrière, nouveau départ !')}break}});
load();render();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
