<style>
:root{color-scheme:dark;--lime:#d5f777;--teal:#8ce5cb;--text:#f8f8ed;--muted:#b6cfc8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071b1d;color:var(--text);overscroll-behavior:none}button{font:inherit;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.42;cursor:default}#app{width:100%;max-width:620px;height:100dvh;min-height:540px;margin:auto;position:relative;isolation:isolate;overflow:hidden;background:#244b4d;box-shadow:0 0 80px #0009}canvas{display:block;width:100%;height:100%;touch-action:none}
#veil{position:absolute;inset:0;background:linear-gradient(#061b2285,transparent 25%,transparent 67%,#071c209e);pointer-events:none;z-index:1}#header{position:absolute;z-index:4;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.logo{font-size:11px;font-weight:950;letter-spacing:1.4px;line-height:1.1;text-shadow:0 2px 8px #0009}.logo b{display:block;color:var(--lime);font-size:21px;letter-spacing:.3px}.version{font-size:10px;border:1px solid #ffffff68;padding:2px 5px;border-radius:6px;color:#fefde9;vertical-align:middle}.bank{background:#0b292acc;border:1px solid #ffffff44;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:950;white-space:nowrap;backdrop-filter:blur(6px)}
#hud{position:absolute;display:none;z-index:4;left:16px;right:16px;top:75px;pointer-events:none}#hud.on{display:block}.hudtitle{display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:950;text-shadow:0 2px 7px #000a}.track{height:8px;margin:7px 0 9px;background:#07232499;border:1px solid #e0f9e488;border-radius:8px;overflow:hidden}.track b{display:block;width:0;height:100%;background:linear-gradient(90deg,#73dfce,#def76e)}.hudrow{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:900;gap:7px;text-shadow:0 2px 7px #000c}.energy{display:inline-block;vertical-align:middle;width:min(95px,22vw);height:8px;background:#071f1ab8;border:1px solid #ffffff72;border-radius:6px;overflow:hidden}.energy b{display:block;width:100%;height:100%;background:#70ead4}.pause{pointer-events:auto;border:1px solid #ffffff63;border-radius:11px;background:#0e2a2cdb;color:#fff;font-size:17px;min-width:37px;min-height:37px}
#panel{position:absolute;z-index:3;inset:0;display:flex;align-items:flex-end;pointer-events:none;padding:72px 17px max(16px,env(safe-area-inset-bottom))}#panel.hide{display:none}.sheet{pointer-events:auto;width:100%;max-height:min(78dvh,760px);overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(145deg,#0c2e30f5,#071b24f8);border:1px solid #ffffff4b;border-radius:25px;padding:20px;box-shadow:0 20px 70px #0009;backdrop-filter:blur(14px)}.eyebrow{font-size:10px;color:var(--teal);font-weight:950;letter-spacing:1.8px;text-transform:uppercase}.sheet h1{font-size:clamp(32px,8vw,44px);line-height:.98;letter-spacing:-1.4px;margin:8px 0 10px}.sheet h2{font-size:27px;margin:7px 0 10px}.sheet p{color:#d5e6e1;font-size:13px;line-height:1.5;margin:9px 0 14px}.accent{color:var(--lime)}.stats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.stat{border:1px solid #ffffff22;background:#ffffff13;padding:8px 9px;border-radius:9px;font-size:11px}.btn{border:0;border-radius:13px;background:var(--lime);color:#15271e;font-weight:950;font-size:14px;padding:12px;min-height:46px;box-shadow:0 4px 0 #7b9a47}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7b9a47}.btn.alt{background:#284d4c;color:#effaf1;border:1px solid #ffffff32;box-shadow:none}.btn.out{background:transparent;color:#f1f9f2;border:1px solid #ffffff42;box-shadow:none}.full{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.course,.gear{background:#ffffff0e;border:1px solid #ffffff29;padding:12px;border-radius:15px;display:flex;align-items:center;gap:10px;margin:8px 0}.course{cursor:pointer}.course.active{border-color:var(--lime);background:#c8f67817}.course .pic,.gear .pic{font-size:25px;min-width:28px}.course strong,.gear strong{font-size:13px}.course small,.gear small{display:block;color:#bcd1ca;line-height:1.4;font-size:11px;margin-top:3px}.course .right{margin-left:auto;font-size:10px;color:var(--lime);font-weight:950}.gear{display:grid;grid-template-columns:32px 1fr auto}.gear button{border:0;border-radius:9px;padding:8px;background:var(--lime);color:#13251b;font-size:11px;font-weight:950}.tip{border:1px dashed #c0ffb35e;background:#ffffff0b;padding:11px;border-radius:12px;line-height:1.65;font-size:12px;color:#d7eadc}.muted{color:#a8c5bb!important;font-size:11px!important}
#controls{position:absolute;z-index:5;bottom:max(18px,env(safe-area-inset-bottom));left:15px;right:15px;display:none;justify-content:space-between;gap:12px;pointer-events:none;align-items:flex-end}#controls.on{display:flex}.buttons{display:flex;gap:9px}.control{min-height:66px;min-width:69px;pointer-events:auto;border-radius:18px;border:1px solid #ffffff82;background:#0b2b30cb;color:#fff;font-size:27px;font-weight:950;backdrop-filter:blur(7px);box-shadow:0 9px 25px #0006;user-select:none;touch-action:none}.control small{display:block;font-size:9px;letter-spacing:.6px}.control.active,.control:active{background:#c6f46c;color:#13251b}.control.boost{background:#af6637e0}#toast{position:absolute;z-index:8;top:24%;left:50%;transform:translateX(-50%) translateY(-7px);padding:11px 16px;background:#0c3030e8;border:1px solid #def8a28c;border-radius:13px;font-weight:950;font-size:13px;text-align:center;opacity:0;pointer-events:none;white-space:nowrap;max-width:92%;transition:opacity .18s,transform .18s}#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#modal{position:absolute;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#05181dbb;backdrop-filter:blur(8px)}#modal.on{display:flex}.dialog{width:100%;max-width:440px;padding:23px;border-radius:24px;background:#113537;border:1px solid #ffffff4b;box-shadow:0 20px 75px #000a;text-align:center}.dialog h2{font-size:28px;letter-spacing:-.8px;margin:7px 0}.dialog p{font-size:13px;color:#d8e6de;line-height:1.5}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.result div{padding:10px 4px;background:#ffffff12;border:1px solid #ffffff27;border-radius:11px}.result b{display:block;color:var(--lime);font-size:21px}.result small{font-size:10px;color:#c8dbd3}
.skin-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 15px}.skin-card{border:1px solid #ffffff3a;background:#143536;border-radius:13px;padding:11px 5px;color:#edf7ee;min-height:84px;font-size:11px;font-weight:850;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.skin-card.selected{border:2px solid var(--lime);background:#c6ef751a}.skin-dot{display:block;width:30px;height:30px;border-radius:50%;border:3px solid #ffffff61;box-shadow:0 3px 8px #0006}.skin-card small{font-size:9px;opacity:.83}.skin-note{font-size:11px;color:#cde3d9;line-height:1.5;margin:2px 0 8px} @media(max-height:720px){.sheet{padding:15px;max-height:77dvh}.sheet h1{font-size:32px}.control{min-height:54px;min-width:58px;font-size:22px}.hudrow{font-size:12px}}@media(min-width:850px){body::after{content:'TRAIL CHAOS / SIDE TRAIL';position:fixed;color:#d4f673;font-size:20px;font-weight:950;right:calc(50% + 370px);top:40%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app">
<canvas id="game" aria-label="Trail Chaos, course en vue latérale. Glissez vers le haut pour sauter et vers le bas pour vous baisser."></canvas>
<div id="veil"></div>
<div id="header"><div class="logo">TRAIL CHAOS <b>SIDE TRAIL <span class="version">V3.9</span></b></div><div class="bank">🟡 <span id="bank">0</span></div></div>
<div id="hud"><div class="hudtitle"><span id="courseName">FORÊT DES RACINES</span><span id="distance">0 / 8 km</span></div><div class="track"><b id="progress"></b></div><div class="hudrow"><span id="hearts">❤️❤️❤️</span><span>⚡ <span class="energy"><b id="energy"></b></span></span><span id="wallet">🟡 0</span><button id="pause" class="pause" aria-label="Pause">Ⅱ</button></div></div>
<main id="panel"></main>
<div id="controls"><div class="buttons"><button id="duck" class="control" aria-label="Se baisser">↓<small>SE BAISSER</small></button><button id="jump" class="control" aria-label="Sauter">↑<small>SAUTER</small></button></div><div class="buttons"><button id="boost" class="control boost" aria-label="Accélérer">⚡<small>SPRINT</small></button></div></div>
<div id="toast"></div><div id="modal"></div>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d');
const COURSES=[
 {id:'forest',name:'Forêt des Racines',emoji:'🌲',km:8,length:11200,mode:'forest',difficulty:1,desc:'Sous-bois, passages boueux, petit ruisseau'},
 {id:'crest',name:'Crêtes du Vent',emoji:'⛰️',km:21,length:16000,mode:'mountain',difficulty:2,desc:'Alpages, sentier pierreux et dénivelé'},
 {id:'night',name:'Ultra Nocturne',emoji:'🌙',km:45,length:21200,mode:'night',difficulty:3,desc:'Nuit, frontale, racines et brouillard'}
];
const SHOP=[
 {id:'shoes',emoji:'👟',name:'Chaussures de trail',sub:['Semelles du dimanche','Crampons sérieux','Accroche de bouquetin','Adhérence de légende'],prices:[0,35,90,170],effect:'Un cœur supplémentaire par niveau'},
 {id:'vest',emoji:'🎒',name:'Gilet de trail',sub:['Poches imaginaires','Deux flasques','Ravito premium','Autonomie d’ultra'],prices:[0,30,75,145],effect:'Moins de fatigue'},
 {id:'gel',emoji:'🍯',name:'Gels énergétiques',sub:['Goût dentifrice','Banane douteuse','Carburant de champion','Turbo ravito'],prices:[0,25,65,125],effect:'Ravitos plus efficaces'},
 {id:'lamp',emoji:'🔦',name:'Frontale',sub:['Lampe de poche','Éclairage correct','Pleine puissance','Phare de stade'],prices:[0,25,60,115],effect:'Meilleure visibilité la nuit'}
];
const SKINS=[
{id:'corail',name:'Corail',tag:'Trail classique',top:'#fa674b',shadow:'#b63e36',short:'#1c3340',cap:'#c8ed77',sole:'#eefff7',stripe:'#9bead8',vest:'#255764',flask:'#83e8ed'},
{id:'alpage',name:'Alpage',tag:'Rapide & léger',top:'#b9e46f',shadow:'#538e57',short:'#244c57',cap:'#e9f8d0',sole:'#f7fbf8',stripe:'#52d6bf',vest:'#255c52',flask:'#e1f9b2'},
{id:'nocturne',name:'Nocturne',tag:'Ultra de nuit',top:'#8c86ef',shadow:'#574aa8',short:'#233246',cap:'#ecb768',sole:'#dfe8ff',stripe:'#d1caff',vest:'#354c67',flask:'#a1daf1'}
];
const defaults={coins:0,levels:{shoes:0,vest:0,gel:0,lamp:0},unlocked:0,wins:0,best:{},sound:false,skin:"corail"};
let stored=null;try{stored=JSON.parse(localStorage.getItem('trail-chaos-runner-v2')||'null')}catch(_){}
let profile={...defaults,...(stored&&typeof stored==='object'?stored:{}),levels:{...defaults.levels,...(stored?.levels||{})}};
if(!SKINS.some(s=>s.id===profile.skin))profile.skin='corail';
const save=()=>{try{localStorage.setItem('trail-chaos-runner-v2',JSON.stringify(profile))}catch(_){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,fract=v=>v-Math.floor(v),hash=(a,b=0)=>fract(Math.sin(a*127.18+b*312.7+42.19)*43758.5453);
const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
let W=400,H=760,DPR=1,last=0,sceneTime=0,screen='home',selected=0,run=null,toastTimer=0,camX=-116,camHeight=0,fx=[];
const keys={boost:false,duck:false},swipe={active:false,x:0,y:0,id:null};
function showToast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('on'),1350)}
function display(html){$('#panel').innerHTML=`<section class="sheet">${html}</section>`;$('#panel').classList.remove('hide');$('#hud').classList.remove('on');$('#controls').classList.remove('on');$('#modal').classList.remove('on');$('#bank').textContent=fmt(profile.coins)}
function nav(target){screen=target;switch(target){case'home':home();break;case'courses':courses();break;case'shop':shop();break;default:help()}}
function home(){const c=COURSES[selected];display(`<span class="eyebrow">🏔️ Le trail prend du relief · V3.9</span><h1>COURS.<br><span class="accent">EXPLORE.</span><br>FRANCHIS.</h1><p>Bras repensés avec pivot à l’épaule, avant-bras plus fixes et gilet de trail allégé pour un rendu moins rando.</p><div class="stats"><span class="stat">🏆 ${profile.wins} arrivées</span><span class="stat">🟡 ${fmt(profile.coins)} pièces</span><span class="stat">👟 Niv. ${profile.levels.shoes+1}</span><span class="stat">🎽 ${SKINS.find(x=>x.id===profile.skin)?.name||"Corail"}</span></div><div class="course active" id="change"><span class="pic">${c.emoji}</span><div><strong>${c.name}</strong><small>${c.km} km · ${c.desc}</small></div><span class="right">CHANGER ›</span></div><button id="go" class="btn full" style="margin-top:10px">▶ COURIR SUR LE SENTIER</button><div class="actions"><button id="shopBtn" class="btn alt">🎒 Boutique</button><button id="helpBtn" class="btn alt">🎮 Commandes</button></div><p class="muted" style="text-align:center;margin-bottom:0">↑ Glisse vers le haut pour sauter · ↓ vers le bas pour te baisser</p>`);$('#go').onclick=begin;$('#change').onclick=()=>nav('courses');$('#shopBtn').onclick=()=>nav('shop');$('#helpBtn').onclick=()=>nav('help')}
function courses(){display(`<span class="eyebrow">🗺️ Choisis ton parcours</span><h2>Les sentiers</h2><p>Chaque circuit traverse maintenant plusieurs ambiances visuelles avec un arrière-plan qui se transforme au fil de la progression. Termine une course pour débloquer la suivante.</p>${COURSES.map((c,i)=>`<div class="course ${i===selected?'active':''}" data-course="${i}" style="opacity:${i>profile.unlocked?.54:1}"><span class="pic">${i>profile.unlocked?'🔒':c.emoji}</span><div><strong>${c.name}</strong><small>${c.km} km · ${c.desc}</small></div><span class="right">${i>profile.unlocked?'BLOQUÉ':i===selected?'✓ CHOISI':'CHOISIR'}</span></div>`).join('')}<div class="actions"><button class="btn alt" id="back">← Retour</button><button class="btn" id="go">▶ Courir</button></div>`);document.querySelectorAll('[data-course]').forEach(el=>el.onclick=()=>{const i=+el.dataset.course;if(i>profile.unlocked)return showToast('Termine le parcours précédent 🔒');selected=i;courses()});$('#back').onclick=()=>nav('home');$('#go').onclick=begin}
function shop(){const skin=SKINS.find(x=>x.id===profile.skin)||SKINS[0];display(`<span class="eyebrow">🎒 Ton équipement</span><h2>Boutique <span class="accent">🟡 ${fmt(profile.coins)}</span></h2><p>Améliore ton matériel et choisis la tenue de ton coureur. Les tenues sont cosmétiques et gratuites.</p><div class="eyebrow">🏃 Tenue du traileur</div><div class="skin-picker">${SKINS.map(s=>`<button class="skin-card ${profile.skin===s.id?'selected':''}" data-skin="${s.id}"><span class="skin-dot" style="background:linear-gradient(130deg,${s.top} 0 55%,${s.short} 55% 100%)"></span>${s.name}<small>${profile.skin===s.id?'✓ Équipée':s.tag}</small></button>`).join('')}</div><div class="skin-note">La casquette, le maillot, le short, les chaussures et le gilet changent avec ta tenue et tes équipements achetés.</div><div class="eyebrow">⚙️ Améliorations</div>${SHOP.map(g=>{const lvl=clamp(profile.levels[g.id]||0,0,3),cost=g.prices[lvl+1],max=lvl===3;return `<div class="gear"><span class="pic">${g.emoji}</span><div><strong>${g.name} <span class="accent">${lvl+1}/4</span></strong><small>${g.sub[lvl]} · ${g.effect}</small></div><button data-buy="${g.id}" ${max||profile.coins<cost?'disabled':''}>${max?'MAX':`🟡 ${cost}`}</button></div>`}).join('')}<button class="btn alt full" id="back">← Retour</button>`);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const g=SHOP.find(i=>i.id===b.dataset.buy),lvl=profile.levels[g.id],cost=g.prices[lvl+1];if(lvl>=3||profile.coins<cost)return;profile.coins-=cost;profile.levels[g.id]++;save();shop();showToast('Équipement amélioré !')});document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{profile.skin=b.dataset.skin;save();shop();showToast('🎽 Tenue '+SKINS.find(x=>x.id===profile.skin).name+' équipée !')});$('#back').onclick=()=>nav('home')}
function help(){display(`<span class="eyebrow">🎮 Comment jouer</span><h2>Maîtrise le terrain</h2><div class="tip"><b>Sur iPhone / téléphone</b><br>Glisse ton doigt <b>vers le haut</b> sur l’écran pour sauter.<br>Glisse <b>vers le bas</b> pour te baisser sous les branches.<br>Un appui rapide sur le terrain déclenche aussi un saut.<br>Maintiens ⚡ pour sprinter (cela consomme de l’énergie).<br>Les boutons du bas fonctionnent aussi.<br><br><b>Sur ordinateur</b><br>↑ / Espace : saut · ↓ : se baisser · Maj : sprint · P : pause</div><div class="stats"><span class="stat">🪵 Tronc → saute</span><span class="stat">🌿 Branche → baisse-toi</span><span class="stat">🟫 Boue → saute ou ralentis</span><span class="stat">🪨 Roche → saute</span><span class="stat">🟡 Pièces → collecte</span></div><button class="btn full" id="back">C'est parti !</button>`);$('#back').onclick=()=>nav('home')}
// Relie les bosses, les faux plats et les descentes à une même altitude physique.
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function hill(x,mid,width,height){const t=Math.abs(x-mid)/width;return t>=1?0:height*.5*(1+Math.cos(Math.PI*t))}
function elevation(x,c=COURSES[selected]){const a=c.mode==='mountain'?1.36:c.mode==='night'?1.07:1;let y=a*(29*Math.sin(x*.0025+.4)+15*Math.sin(x*.0062+.5)+6*Math.sin(x*.014));let zone=Math.floor(x/1700);for(let i=zone-1;i<=zone+1;i++){const center=i*1700+820+hash(i,8)*300;const high=55+hash(i,11)*54; y+=hill(x,center,440+hash(i,3)*140,high)}return y}
function slope(x,c){return (elevation(x+20,c)-elevation(x-20,c))/40}

   if(here.name.includes('PIERRIER')||here.name.includes('CRÊTE')){ctx.fillStyle=i%3===0?'#8f8778':'#766e61';ctx.beginPath();ctx.moveTo(x-6,y+1);ctx.lineTo(x-1,y-5);ctx.lineTo(x+7,y-2);ctx.lineTo(x+5,y+3);ctx.closePath();ctx.fill(); if(i%5===0){ctx.fillStyle='#c8c0af66';ctx.beginPath();ctx.arc(x-1,y-3,2.2,0,7);ctx.fill();}}
   else {ctx.strokeStyle=i%5===0?here.accent:here.trees[1];ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y-8);ctx.moveTo(x,y);ctx.lineTo(x+4,y-10);ctx.stroke(); if(i%7===0){ctx.fillStyle=here.flower;ctx.beginPath();ctx.arc(x+2,y-9,2.5,0,7);ctx.fill();}}
   if(here.name.includes('RUISSEAU')&&i%11===0){ctx.fillStyle='#7dc6d844';ctx.beginPath();ctx.ellipse(x+8,y+2,13,3,0,0,7);ctx.fill();}
 }
 // segments visuels qui marquent la progression du parcours
 for(let i=Math.floor(camX/620)-1;i<=Math.ceil((camX+W)/620)+1;i++){
   const wx=i*620+180,x=wx-camX,here=worldPalette(wx,c);if(x<-160||x>W+160)continue;
   if(here.name.includes('CLAIRIÈRE')){ctx.fillStyle=alphaColor(here.accent,.15);ctx.beginPath();ctx.roundRect(x-55,groundY(wx)-10,110,12,5);ctx.fill();}
   else if(here.name.includes('RUISSEAU')){ctx.strokeStyle='#855c3f';ctx.lineWidth=6;ctx.beginPath();for(let p=0;p<=100;p+=10){ctx.lineTo(x+p,groundY(wx+p)+1)}ctx.stroke();ctx.strokeStyle='#d8bd91';ctx.lineWidth=2;for(let p=0;p<=100;p+=17){ctx.beginPath();ctx.moveTo(x+p,groundY(wx+p)-1);ctx.lineTo(x+p+9,groundY(wx+p+9)-1);ctx.stroke();}}
   else if(here.name.includes('PIERRIER')){ctx.fillStyle='#7e786d';for(let p=0;p<110;p+=18){ctx.beginPath();ctx.ellipse(x+p,groundY(wx+p)-3,6,2.4,0,0,7);ctx.fill();}}
 }
}
function drawForeground(){const c=run?.course||COURSES[selected],st=biomeColors();for(let i=Math.floor(camX/118)-1;i<Math.ceil((camX+W)/118)+1;i++){const wx=i*118+hash(i,7)*30,x=wx-camX;if(x<-40||x>W+40)continue;const y=groundY(wx),size=28+hash(i,9)*52,here=worldPalette(wx,c);
 if(c.mode!=='mountain'&&(!here.name.includes('CLAIRIÈRE')||i%3===0)){ctx.fillStyle='#5e452d';ctx.fillRect(x-4,y-size*.52,8,size*.54);ctx.fillStyle=here.trees[i%2];for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(x,y-size*(1.0-j*.22));ctx.lineTo(x-size*(.26+j*.06),y-size*(.37-j*.1));ctx.lineTo(x+size*(.26+j*.06),y-size*(.37-j*.1));ctx.closePath();ctx.fill()} if(here.name.includes('RUISSEAU')&&i%4===0){ctx.fillStyle=here.flower;ctx.beginPath();ctx.arc(x+size*.18,y-size*.24,4,0,7);ctx.fill();}}
 else {ctx.fillStyle='#868d84';ctx.beginPath();ctx.moveTo(x-size*.33,y);ctx.lineTo(x-size*.12,y-size*.43);ctx.lineTo(x+size*.18,y-size*.46);ctx.lineTo(x+size*.42,y);ctx.closePath();ctx.fill();ctx.fillStyle='#bcb8ac';ctx.beginPath();ctx.arc(x-size*.02,y-size*.3,4,0,7);ctx.fill();}
}}
function drawObstacle(o){const st=worldPalette(o.x),x=o.x-camX,y=groundY(o.x),wind=Math.sin(sceneTime*2+o.x*.013);if(x<-100||x>W+100)return;ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+2,30,6,0,0,7);ctx.fill();
 if(o.type==='coin'){const yy=y-o.alt+Math.sin(sceneTime*5+o.x)*3;ctx.save();ctx.translate(x,yy);ctx.scale(.78+.22*Math.abs(Math.cos(sceneTime*3+o.x)),1);ctx.fillStyle='#ffd258';ctx.strokeStyle='#fff5b5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#a97327';ctx.font='900 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,0);ctx.restore();return}
 if(o.type==='drink'){ctx.fillStyle='#7fe2d5';ctx.beginPath();ctx.roundRect(x-9,y-49,18,32,5);ctx.fill();ctx.fillStyle='#dffbf3';ctx.fillRect(x-5,y-54,10,6);ctx.fillStyle='#ffffffbb';ctx.fillRect(x-3,y-43,6,14);return}
 if(o.type==='rock'){ctx.fillStyle='#6f7b81';ctx.beginPath();ctx.moveTo(x-30,y);ctx.lineTo(x-24,y-18);ctx.lineTo(x-11,y-34);ctx.lineTo(x+8,y-36);ctx.lineTo(x+24,y-20);ctx.lineTo(x+31,y);ctx.closePath();ctx.fill();ctx.fillStyle='#aeb7b8';ctx.beginPath();ctx.moveTo(x-18,y-18);ctx.lineTo(x-7,y-33);ctx.lineTo(x+6,y-30);ctx.lineTo(x-3,y-15);ctx.closePath();ctx.fill();ctx.strokeStyle='#546066';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-5,y-13);ctx.lineTo(x+7,y-24);ctx.stroke()}
 else if(o.type==='stump'){ctx.fillStyle='#724f34';ctx.beginPath();ctx.roundRect(x-20,y-28,40,28,9);ctx.fill();ctx.fillStyle='#cba06b';ctx.beginPath();ctx.ellipse(x,y-28,19,8,0,0,7);ctx.fill();ctx.strokeStyle='#8a613f';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-28,10,4,0,0,7);ctx.stroke();ctx.strokeStyle='#5f412c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-8,y-14);ctx.lineTo(x-14,y-34);ctx.moveTo(x+6,y-16);ctx.lineTo(x+12,y-38);ctx.stroke();}
 else if(o.type==='log'){ctx.fillStyle='#7a593c';ctx.beginPath();ctx.roundRect(x-29,y-22,58,20,9);ctx.fill();ctx.fillStyle='#b78d5d';ctx.beginPath();ctx.roundRect(x-24,y-19,46,4,2);ctx.fill();ctx.fillStyle='#d5ab77';ctx.beginPath();ctx.ellipse(x+23,y-12,7,10,0,0,7);ctx.fill();ctx.fillStyle='#5f402a';ctx.beginPath();ctx.arc(x+23,y-12,3.5,0,7);ctx.fill();ctx.fillStyle='#7ca265';ctx.beginPath();ctx.ellipse(x-10,y-19,8,4,.2,0,7);ctx.ellipse(x+2,y-18,7,4,-.2,0,7);ctx.fill();}
 else if(o.type==='branch'){ctx.strokeStyle='#5d422d';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+36,y+3);ctx.lineTo(x+34,y-70);ctx.lineTo(x-35,y-72);ctx.stroke();ctx.strokeStyle='#79aa64';ctx.lineWidth=5;for(let j=0;j<5;j++){ctx.beginPath();ctx.moveTo(x-31+j*15,y-70+(j%2)*4);ctx.lineTo(x-41+j*15,y-81+(j%2)*4);ctx.stroke();ctx.fillStyle=j%2?st.accent:st.trees[1];ctx.beginPath();ctx.ellipse(x-40+j*15+wind*(2+j*.4),y-80+(j%2)*4+Math.sin(sceneTime*2.4+j)*1.5,10,5,wind*.1,0,7);ctx.fill()}}
 else if(o.type==='mud'){ctx.fillStyle='#5d3f2a';ctx.beginPath();ctx.ellipse(x,y-2,41,11,0,0,7);ctx.fill();ctx.fillStyle='#8b623d';ctx.beginPath();ctx.ellipse(x-13,y-4,15+wind*1.5,4,0,0,7);ctx.ellipse(x+10,y-1,10,3,0,0,7);ctx.fill();ctx.strokeStyle='#3f291b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x-8,y-1,7,3.5,5.8);ctx.stroke();}
 else if(o.type==='creek'){ctx.fillStyle='#3d8ea7';ctx.beginPath();ctx.ellipse(x,y,40,10,0,0,7);ctx.fill();ctx.fillStyle='#8ad9ea';ctx.globalAlpha=.45;ctx.beginPath();ctx.ellipse(x-6+Math.sin(sceneTime*4)*3,y-1,18,4,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#dffcff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-30,y-2);ctx.quadraticCurveTo(x,y-13+Math.sin(sceneTime*3)*2,x+30,y-2);ctx.stroke();for(let p=-20;p<=18;p+=10){ctx.strokeStyle='#936a46';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+p,y+5);ctx.lineTo(x+p+8,y+5);ctx.stroke();}}
}
// Traileur de profil, genoux articulés. Le bassin suit le relief et le saut est physique.
function runnerStroke(points,width,color){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(points[0],points[1]);for(let i=2;i<points.length;i+=2)ctx.lineTo(points[i],points[i+1]);ctx.stroke()}
function runnerRound(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function runnerShoe(x,y,angle,palette,back=false){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);
 // Chaussure profilée de trail : pointe effilée, talon discret et semelle fine.
 const upper=back?'#cfdee4':palette.sole;
 ctx.fillStyle=upper;ctx.beginPath();ctx.moveTo(-3.8,-3.2);ctx.quadraticCurveTo(-1.1,-5.0,2.1,-3.1);ctx.lineTo(5.5,-2.7);ctx.quadraticCurveTo(8.8,-2.4,9.2,-.65);ctx.lineTo(8.0,1.05);ctx.lineTo(-4.1,1.05);ctx.closePath();ctx.fill();
 ctx.fillStyle=back?'#5d7984':palette.stripe;ctx.beginPath();ctx.moveTo(-1.7,-2.7);ctx.lineTo(4,-2.25);ctx.lineTo(6,-.85);ctx.lineTo(.7,-.65);ctx.closePath();ctx.fill();
 ctx.strokeStyle=back?'#b7c5ce':palette.shadow;ctx.lineWidth=.75;ctx.beginPath();ctx.moveTo(1,-3.1);ctx.lineTo(2.8,-1.45);ctx.moveTo(3,-2.9);ctx.lineTo(4.7,-1.4);ctx.stroke();
 // Semelle extérieure très fine, crampons optionnels.
 ctx.fillStyle='#24404a';ctx.beginPath();ctx.moveTo(-4,1);ctx.lineTo(8.15,1);ctx.lineTo(7.5,2.2);ctx.lineTo(-3.7,2.2);ctx.closePath();ctx.fill();
 if(profile.levels.shoes>0){ctx.fillStyle='#c6a851';for(let i=0;i<3;i++)ctx.fillRect(-2.4+i*3.4,2.3,1.2,1.1)}
 ctx.restore()
}
function runnerLeg(hip,cycle,back,air,palette){
 const forward=Math.sin(cycle), lift=Math.max(0,Math.cos(cycle)), recovery=Math.max(0,-Math.sin(cycle));
 const kneeX=hip+forward*7.6+(back?-2.3:2.3), kneeY=-17-lift*4.5+recovery*1.2;
 const footX=hip+forward*17.2+(back?-3.2:3.5),footY=air?-16-lift*6.8:-1.2-lift*8.2+recovery*1.8;
 runnerStroke([hip,-30,kneeX,kneeY,footX-0.8,footY-1.2],back?6.8:7.8,back?'#284856':palette.short);
 ctx.fillStyle=back?'#23404a':'#314952';ctx.beginPath();ctx.arc(kneeX,kneeY,back?2.7:3.1,0,Math.PI*2);ctx.fill();
 runnerStroke([footX-1.6,footY-9.2,footX-1.2,footY-3.5],2.6,back?'#9bb1bf':palette.stripe);
 runnerShoe(footX,footY,-forward*.12+(air?0.08:0),palette,back)
}
function runnerRigidArm(shoulderX,shoulderY,swing,front,color){
 const base=front?-0.36:0.92;
 const amp=.72;
 ctx.save();
 ctx.translate(shoulderX,shoulderY);
 ctx.rotate(base+swing*amp);
 ctx.strokeStyle=color;ctx.lineWidth=front?5.5:5.1;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();
 ctx.moveTo(0,0);
 ctx.lineTo(5.5,10.8);
 ctx.lineTo(11.8,6.6);
 ctx.stroke();
 ctx.fillStyle=front?'#e9b58f':'#d6a480';
 ctx.beginPath();ctx.arc(11.8,6.6,2.8,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawRunner(){
 const r=run, palette=SKINS.find(s=>s.id===profile.skin)||SKINS[0],x=(r?.x||0)-camX, ground=groundY(r?.x||0), y=ground-(r?.jumpY||0);
 const crouch=(r?.duck||0)>0,air=!!r&&!r.grounded;
 const runSpeed=keys.boost?15.8:11.6,phase=(r?.elapsed||sceneTime)*runSpeed;
 const step=Math.sin(phase),bounce=r&&r.grounded&&!crouch?Math.cos(phase*2)*1.95:0;
 ctx.save();ctx.globalAlpha=r?.inv>0&&Math.sin(sceneTime*24)>0?.45:1;
 ctx.fillStyle='#051c2061';ctx.beginPath();ctx.ellipse(x,ground+4,air?18:24,air?3.2:5,0,0,Math.PI*2);ctx.fill();
 ctx.translate(x,y+bounce);
 if(crouch){
   runnerStroke([-10,-12,-21,-2,-24,0],7,palette.short);runnerShoe(-25,1,.02,palette,true);
   runnerStroke([4,-13,11,-5,18,-1],7,palette.short);runnerShoe(19,-1,-.08,palette);
   runnerRound(-17,-42,33,25,10,palette.top);
   runnerRound(-10,-36,7,13,4,palette.vest); /* gilet/sac réduit */
   runnerRound(-7,-22,24,9,4,palette.short);
   runnerRigidArm(-6,-38,-.15,false,'#ddad89');
   runnerRigidArm(9,-35,.12,true,'#e9b991');
   ctx.fillStyle='#e7b68f';ctx.beginPath();ctx.arc(15,-46,9.2,0,Math.PI*2);ctx.fill();
   runnerRound(9,-56,18,7,4,palette.cap);runnerRound(22,-54,8,2.4,2,palette.stripe);
   if(profile.levels.lamp>0||r?.course?.mode==='night'){runnerRound(13,-55,8,4,2,'#ffda7e')}
   ctx.restore();return;
 }
 const jumping=air&&r.jumpY>2;
 // jambe arrière
 runnerLeg(-6,phase+Math.PI,true,jumping,palette);
 // bras arrière : pivot unique à l'épaule
 runnerRigidArm(-8,-59,-step,false,'#ddaa83');
 // petit gilet arrière discret, vraiment réduit
 runnerRound(-16.5,-63,7.2,22,4,palette.vest);
 if(profile.levels.vest>1){runnerRound(-17.6,-56,2,8,2,palette.stripe)}
 // jambe avant
 runnerLeg(6,phase,false,jumping,palette);
 ctx.save();ctx.rotate(-.07+Math.cos(phase)*.02);
 // short de course
 ctx.fillStyle=palette.short;ctx.beginPath();ctx.moveTo(-12,-36);ctx.lineTo(13,-37);ctx.lineTo(15,-27);ctx.lineTo(1,-25);ctx.lineTo(-13,-28);ctx.closePath();ctx.fill();
 ctx.strokeStyle=palette.stripe;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(7,-29);ctx.lineTo(12,-29);ctx.stroke();
 // maillot cintré avec taille plus sportive
 ctx.fillStyle=palette.top;ctx.beginPath();ctx.moveTo(-14,-65);ctx.quadraticCurveTo(-1,-71,11,-63);ctx.lineTo(13,-38);ctx.lineTo(-10,-36);ctx.closePath();ctx.fill();
 ctx.fillStyle=palette.shadow;ctx.beginPath();ctx.moveTo(-12,-62);ctx.lineTo(-7,-59);ctx.lineTo(-9,-39);ctx.lineTo(-13,-39);ctx.closePath();ctx.fill();
 // gilet frontal et flasque réduits pour faire moins sac à dos
 runnerStroke([-8.2,-61.5,-7.6,-41],2.4,palette.vest);
 runnerStroke([9.2,-59,9.2,-45],2.2,palette.stripe);
 runnerRound(7.6,-55.5,3.7,11.4,1.8,palette.vest);
 runnerRound(7.9,-53.8,3.0,8.0,1.5,palette.flask);
 runnerRound(8.0,-56.7,2.8,3.0,1.3,'#ecf7ed');
 // dossard
 runnerRound(-3,-44,10,11,2,'#f0f2ed'); ctx.font='bold 7px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#16465b';ctx.fillText('42',2,-38);
 // bras avant : pivot unique à l'épaule
 runnerRigidArm(9,-61,step,true,'#efbc95');
 // cou + tête un peu plus propre
 runnerRound(8,-74,7,10,3,'#dca985');
 ctx.fillStyle='#e6b68f';ctx.beginPath();ctx.arc(15,-82,10.5,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.moveTo(22.5,-81.8);ctx.lineTo(26.8,-78.4);ctx.lineTo(22.2,-76.5);ctx.closePath();ctx.fill();
 ctx.fillStyle='#2c3f41';ctx.beginPath();ctx.arc(20.5,-83,1.35,0,Math.PI*2);ctx.fill();
 // casquette plus nette
 runnerRound(5,-93.5,24,7.5,4,palette.cap); runnerRound(26.2,-90.8,10.5,2.8,2,palette.stripe);
 ctx.fillStyle=palette.shadow;ctx.beginPath();ctx.moveTo(7,-94.5);ctx.lineTo(12,-98.2);ctx.lineTo(18,-94.5);ctx.closePath();ctx.fill();
 if(profile.levels.lamp>0||r?.course?.mode==='night'){runnerRound(20.5,-95,6.7,4,2,'#ffe29c');ctx.fillStyle='#fdf4bf44';ctx.beginPath();ctx.moveTo(27.5,-91.3);ctx.lineTo(49,-94);ctx.lineTo(49,-87);ctx.closePath();ctx.fill()}
 ctx.restore();
 if(keys.boost&&r?.grounded){runnerStroke([-28,-51,-45,-51],1.8,'#ffffff3c');runnerStroke([-28,-41,-42,-41],1.5,'#ffffff29')}
 ctx.restore()
}
function render(){ctx.clearRect(0,0,W,H);drawBackground();drawGround();drawForeground();if(run){for(const o of run.objects)if(!o.done&&o.x>camX-90&&o.x<camX+W+90)drawObstacle(o)}drawRunner();drawEffects();if(run?.inv>0&&Math.sin(sceneTime*23)>0){ctx.fillStyle='#ff596120';ctx.fillRect(0,0,W,H)}const c=run?.course||COURSES[selected];if(c.mode==='night'&&(run?.x||0)/c.length>.32){let lvl=profile.levels.lamp,xx=run?run.x-camX:W*.35;const grad=ctx.createRadialGradient(xx,H*.52,H*.13+lvl*15,xx,H*.52,H*.91);grad.addColorStop(0,'#00061600');grad.addColorStop(1,`rgba(1,6,18,${Math.max(.2,.63-lvl*.12)})`);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H)}}
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width||400;H=rect.height||760;DPR=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
function tick(now){if(!last)last=now;const dt=Math.min(.045,(now-last)/1000);last=now;if(!document.hidden)update(dt);render();requestAnimationFrame(tick)}
// Gestes tactiles sur toute la surface du jeu : swipe vertical, tap et boutons.
canvas.addEventListener('pointerdown',e=>{if(screen!=='run'||run?.paused)return;swipe.active=true;swipe.id=e.pointerId;swipe.x=e.clientX;swipe.y=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointerup',e=>{if(!swipe.active||e.pointerId!==swipe.id)return;const dy=e.clientY-swipe.y,dx=e.clientX-swipe.x;swipe.active=false;if(Math.abs(dy)>28&&Math.abs(dy)>Math.abs(dx)*.75){if(dy<0)jump();else duck()}else if(Math.abs(dy)<20&&Math.abs(dx)<30)jump()});
canvas.addEventListener('pointercancel',()=>swipe.active=false);
$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#duck').addEventListener('pointerdown',e=>{e.preventDefault();duck()});
const boostButton=$('#boost');boostButton.addEventListener('pointerdown',e=>{e.preventDefault();keys.boost=true;boostButton.classList.add('active');try{boostButton.setPointerCapture(e.pointerId)}catch(_){}});for(const t of ['pointerup','pointercancel','lostpointercapture'])boostButton.addEventListener(t,()=>{keys.boost=false;boostButton.classList.remove('active')});
$('#pause').onclick=pause;
window.addEventListener('keydown',e=>{if(screen!=='run')return;if(['ArrowUp','ArrowDown',' ','Shift','p','P','Escape','w','s'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')jump();if(e.key==='ArrowDown'||e.key==='s')duck();if(e.key==='Shift')keys.boost=true;if(e.key==='p'||e.key==='P'||e.key==='Escape')pause()});
window.addEventListener('keyup',e=>{if(e.key==='Shift')keys.boost=false});window.addEventListener('blur',()=>{keys.boost=false;if(run&&screen==='run'&&!run.paused)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&screen==='run'&&!run.paused)pause()});window.addEventListener('resize',resize);
resize();nav('home');requestAnimationFrame(tick);
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
