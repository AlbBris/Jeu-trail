<head>

<style>
:root{color-scheme:dark;--lime:#d5f777;--teal:#8ce5cb;--text:#f8f8ed;--muted:#b6cfc8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071b1d;color:var(--text);overscroll-behavior:none}button{font:inherit;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.42;cursor:default}#app{width:100%;max-width:620px;height:100dvh;min-height:540px;margin:auto;position:relative;isolation:isolate;overflow:hidden;background:#244b4d;box-shadow:0 0 80px #0009}canvas{display:block;width:100%;height:100%;touch-action:none}
#veil{position:absolute;inset:0;background:linear-gradient(#061b2285,transparent 25%,transparent 67%,#071c209e);pointer-events:none;z-index:1}#header{position:absolute;z-index:4;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.logo{font-size:11px;font-weight:950;letter-spacing:1.4px;line-height:1.1;text-shadow:0 2px 8px #0009}.logo b{display:block;color:var(--lime);font-size:21px;letter-spacing:.3px}.version{font-size:10px;border:1px solid #ffffff68;padding:2px 5px;border-radius:6px;color:#fefde9;vertical-align:middle}.bank{background:#0b292acc;border:1px solid #ffffff44;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:950;white-space:nowrap;backdrop-filter:blur(6px)}
#hud{position:absolute;display:none;z-index:4;left:16px;right:16px;top:75px;pointer-events:none}#hud.on{display:block}.hudtitle{display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:950;text-shadow:0 2px 7px #000a}.track{height:8px;margin:7px 0 9px;background:#07232499;border:1px solid #e0f9e488;border-radius:8px;overflow:hidden}.track b{display:block;width:0;height:100%;background:linear-gradient(90deg,#73dfce,#def76e)}.hudrow{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:900;gap:7px;text-shadow:0 2px 7px #000c}.energy{display:inline-block;vertical-align:middle;width:min(95px,22vw);height:8px;background:#071f1ab8;border:1px solid #ffffff72;border-radius:6px;overflow:hidden}.energy b{display:block;width:100%;height:100%;background:#70ead4}.pause{pointer-events:auto;border:1px solid #ffffff63;border-radius:11px;background:#0e2a2cdb;color:#fff;font-size:17px;min-width:37px;min-height:37px}
#panel{position:absolute;z-index:3;inset:0;display:flex;align-items:flex-end;pointer-events:none;padding:72px 17px max(16px,env(safe-area-inset-bottom))}#panel.hide{display:none}.sheet{pointer-events:auto;width:100%;max-height:min(78dvh,760px);overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(145deg,#0c2e30f5,#071b24f8);border:1px solid #ffffff4b;border-radius:25px;padding:20px;box-shadow:0 20px 70px #0009;backdrop-filter:blur(14px)}.eyebrow{font-size:10px;color:var(--teal);font-weight:950;letter-spacing:1.8px;text-transform:uppercase}.sheet h1{font-size:clamp(32px,8vw,44px);line-height:.98;letter-spacing:-1.4px;margin:8px 0 10px}.sheet h2{font-size:27px;margin:7px 0 10px}.sheet p{color:#d5e6e1;font-size:13px;line-height:1.5;margin:9px 0 14px}.accent{color:var(--lime)}.stats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.stat{border:1px solid #ffffff22;background:#ffffff13;padding:8px 9px;border-radius:9px;font-size:11px}.btn{border:0;border-radius:13px;background:var(--lime);color:#15271e;font-weight:950;font-size:14px;padding:12px;min-height:46px;box-shadow:0 4px 0 #7b9a47}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7b9a47}.btn.alt{background:#284d4c;color:#effaf1;border:1px solid #ffffff32;box-shadow:none}.btn.out{background:transparent;color:#f1f9f2;border:1px solid #ffffff42;box-shadow:none}.full{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.course,.gear{background:#ffffff0e;border:1px solid #ffffff29;padding:12px;border-radius:15px;display:flex;align-items:center;gap:10px;margin:8px 0}.course{cursor:pointer}.course.active{border-color:var(--lime);background:#c8f67817}.course .pic,.gear .pic{font-size:25px;min-width:28px}.course strong,.gear strong{font-size:13px}.course small,.gear small{display:block;color:#bcd1ca;line-height:1.4;font-size:11px;margin-top:3px}.course .right{margin-left:auto;font-size:10px;color:var(--lime);font-weight:950}.gear{display:grid;grid-template-columns:32px 1fr auto}.gear button{border:0;border-radius:9px;padding:8px;background:var(--lime);color:#13251b;font-size:11px;font-weight:950}.tip{border:1px dashed #c0ffb35e;background:#ffffff0b;padding:11px;border-radius:12px;line-height:1.65;font-size:12px;color:#d7eadc}.muted{color:#a8c5bb!important;font-size:11px!important}
#controls{position:absolute;z-index:5;bottom:max(18px,env(safe-area-inset-bottom));left:15px;right:15px;display:none;justify-content:space-between;gap:12px;pointer-events:none;align-items:flex-end}#controls.on{display:flex}.buttons{display:flex;gap:9px}.control{min-height:66px;min-width:69px;pointer-events:auto;border-radius:18px;border:1px solid #ffffff82;background:#0b2b30cb;color:#fff;font-size:27px;font-weight:950;backdrop-filter:blur(7px);box-shadow:0 9px 25px #0006;user-select:none;touch-action:none}.control small{display:block;font-size:9px;letter-spacing:.6px}.control.active,.control:active{background:#c6f46c;color:#13251b}.control.boost{background:#af6637e0}#toast{position:absolute;z-index:8;top:24%;left:50%;transform:translateX(-50%) translateY(-7px);padding:11px 16px;background:#0c3030e8;border:1px solid #def8a28c;border-radius:13px;font-weight:950;font-size:13px;text-align:center;opacity:0;pointer-events:none;white-space:nowrap;max-width:92%;transition:opacity .18s,transform .18s}#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#modal{position:absolute;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#05181dbb;backdrop-filter:blur(8px)}#modal.on{display:flex}.dialog{width:100%;max-width:440px;padding:23px;border-radius:24px;background:#113537;border:1px solid #ffffff4b;box-shadow:0 20px 75px #000a;text-align:center}.dialog h2{font-size:28px;letter-spacing:-.8px;margin:7px 0}.dialog p{font-size:13px;color:#d8e6de;line-height:1.5}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.result div{padding:10px 4px;background:#ffffff12;border:1px solid #ffffff27;border-radius:11px}.result b{display:block;color:var(--lime);font-size:21px}.result small{font-size:10px;color:#c8dbd3}
@media(max-height:720px){.sheet{padding:15px;max-height:77dvh}.sheet h1{font-size:32px}.control{min-height:54px;min-width:58px;font-size:22px}.hudrow{font-size:12px}}@media(min-width:850px){body::after{content:'TRAIL CHAOS / SIDE TRAIL';position:fixed;color:#d4f673;font-size:20px;font-weight:950;right:calc(50% + 370px);top:40%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<canvas id="game" aria-label="Trail Chaos, course en vue latérale. Glissez vers le haut pour sauter et vers le bas pour vous baisser."></canvas>
<div id="veil"></div>
<div id="header"><div class="logo">TRAIL CHAOS <b>SIDE TRAIL <span class="version">V3.1</span></b></div><div class="bank">🟡 <span id="bank">0</span></div></div>
<div id="hud"><div class="hudtitle"><span id="courseName">FORÊT DES RACINES</span><span id="distance">0 / 8 km</span></div><div class="track"><b id="progress"></b></div><div class="hudrow"><span id="hearts">❤️❤️❤️</span><span>⚡ <span class="energy"><b id="energy"></b></span></span><span id="wallet">🟡 0</span><button id="pause" class="pause" aria-label="Pause">Ⅱ</button></div></div>
<main id="panel"></main>
<div id="controls"><div class="buttons"><button id="duck" class="control" aria-label="Se baisser">↓<small>SE BAISSER</small></button><button id="jump" class="control" aria-label="Sauter">↑<small>SAUTER</small></button></div><div class="buttons"><button id="boost" class="control boost" aria-label="Accélérer">⚡<small>SPRINT</small></button></div></div>
<div id="toast"></div><div id="modal"></div>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d');
const COURSES=[
 {id:'forest',name:'Forêt des Racines',emoji:'🌲',km:8,length:11200,mode:'forest',difficulty:1,desc:'Sous-bois, passages boueux, petit ruisseau'},
 {id:'crest',name:'Crêtes du Vent',emoji:'⛰️',km:21,length:16000,mode:'mountain',difficulty:2,desc:'Alpages, sentier pierreux et dénivelé'},
 {id:'night',name:'Ultra Nocturne',emoji:'🌙',km:45,length:21200,mode:'night',difficulty:3,desc:'Nuit, frontale, racines et brouillard'}
];
const SHOP=[
 {id:'shoes',emoji:'👟',name:'Chaussures de trail',sub:['Semelles du dimanche','Crampons sérieux','Accroche de bouquetin','Adhérence de légende'],prices:[0,35,90,170],effect:'Un cœur supplémentaire par niveau'},
 {id:'vest',emoji:'🎒',name:'Gilet de trail',sub:['Poches imaginaires','Deux flasques','Ravito premium','Autonomie d’ultra'],prices:[0,30,75,145],effect:'Moins de fatigue'},
 {id:'gel',emoji:'🍯',name:'Gels énergétiques',sub:['Goût dentifrice','Banane douteuse','Carburant de champion','Turbo ravito'],prices:[0,25,65,125],effect:'Ravitos plus efficaces'},
 {id:'lamp',emoji:'🔦',name:'Frontale',sub:['Lampe de poche','Éclairage correct','Pleine puissance','Phare de stade'],prices:[0,25,60,115],effect:'Meilleure visibilité la nuit'}
];
const defaults={coins:0,levels:{shoes:0,vest:0,gel:0,lamp:0},unlocked:0,wins:0,best:{},sound:false};
let stored=null;try{stored=JSON.parse(localStorage.getItem('trail-chaos-runner-v2')||'null')}catch(_){}
let profile={...defaults,...(stored&&typeof stored==='object'?stored:{}),levels:{...defaults.levels,...(stored?.levels||{})}};
const save=()=>{try{localStorage.setItem('trail-chaos-runner-v2',JSON.stringify(profile))}catch(_){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,fract=v=>v-Math.floor(v),hash=(a,b=0)=>fract(Math.sin(a*127.18+b*312.7+42.19)*43758.5453);
const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
let W=400,H=760,DPR=1,last=0,sceneTime=0,screen='home',selected=0,run=null,toastTimer=0,camX=-116,camHeight=0;
const keys={boost:false,duck:false},swipe={active:false,x:0,y:0,id:null};
function showToast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('on'),1350)}
function display(html){$('#panel').innerHTML=`<section class="sheet">${html}</section>`;$('#panel').classList.remove('hide');$('#hud').classList.remove('on');$('#controls').classList.remove('on');$('#modal').classList.remove('on');$('#bank').textContent=fmt(profile.coins)}
function nav(target){screen=target;switch(target){case'home':home();break;case'courses':courses();break;case'shop':shop();break;default:help()}}
function home(){const c=COURSES[selected];display(`<span class="eyebrow">🏔️ Le trail prend du relief · V3.1</span><h1>COURS.<br><span class="accent">GRIMPE.</span><br>SAUTE.</h1><p>Un vrai sentier vallonné en vue latérale : monte les bosses, descends les crêtes, saute les troncs et baisse-toi sous les branches. Le relief influence ton effort et ton allure.</p><div class="stats"><span class="stat">🏆 ${profile.wins} arrivées</span><span class="stat">🟡 ${fmt(profile.coins)} pièces</span><span class="stat">👟 Niv. ${profile.levels.shoes+1}</span></div><div class="course active" id="change"><span class="pic">${c.emoji}</span><div><strong>${c.name}</strong><small>${c.km} km · ${c.desc}</small></div><span class="right">CHANGER ›</span></div><button id="go" class="btn full" style="margin-top:10px">▶ COURIR SUR LE SENTIER</button><div class="actions"><button id="shopBtn" class="btn alt">🎒 Boutique</button><button id="helpBtn" class="btn alt">🎮 Commandes</button></div><p class="muted" style="text-align:center;margin-bottom:0">↑ Glisse vers le haut pour sauter · ↓ vers le bas pour te baisser</p>`);$('#go').onclick=begin;$('#change').onclick=()=>nav('courses');$('#shopBtn').onclick=()=>nav('shop');$('#helpBtn').onclick=()=>nav('help')}
function courses(){display(`<span class="eyebrow">🗺️ Choisis ton parcours</span><h2>Les sentiers</h2><p>Chaque circuit a ses pentes, ses couleurs et ses dangers. Termine une course pour débloquer la suivante.</p>${COURSES.map((c,i)=>`<div class="course ${i===selected?'active':''}" data-course="${i}" style="opacity:${i>profile.unlocked?.54:1}"><span class="pic">${i>profile.unlocked?'🔒':c.emoji}</span><div><strong>${c.name}</strong><small>${c.km} km · ${c.desc}</small></div><span class="right">${i>profile.unlocked?'BLOQUÉ':i===selected?'✓ CHOISI':'CHOISIR'}</span></div>`).join('')}<div class="actions"><button class="btn alt" id="back">← Retour</button><button class="btn" id="go">▶ Courir</button></div>`);document.querySelectorAll('[data-course]').forEach(el=>el.onclick=()=>{const i=+el.dataset.course;if(i>profile.unlocked)return showToast('Termine le parcours précédent 🔒');selected=i;courses()});$('#back').onclick=()=>nav('home');$('#go').onclick=begin}
function shop(){display(`<span class="eyebrow">🎒 Ton équipement</span><h2>Boutique <span class="accent">🟡 ${fmt(profile.coins)}</span></h2><p>Les pièces et les équipements viennent de ta progression actuelle, sans remise à zéro.</p>${SHOP.map(g=>{const lvl=clamp(profile.levels[g.id]||0,0,3),cost=g.prices[lvl+1],max=lvl===3;return `<div class="gear"><span class="pic">${g.emoji}</span><div><strong>${g.name} <span class="accent">${lvl+1}/4</span></strong><small>${g.sub[lvl]} · ${g.effect}</small></div><button data-buy="${g.id}" ${max||profile.coins<cost?'disabled':''}>${max?'MAX':`🟡 ${cost}`}</button></div>`}).join('')}<button class="btn alt full" id="back">← Retour</button>`);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const g=SHOP.find(i=>i.id===b.dataset.buy),lvl=profile.levels[g.id],cost=g.prices[lvl+1];if(lvl>=3||profile.coins<cost)return;profile.coins-=cost;profile.levels[g.id]++;save();shop();showToast('Équipement amélioré !')});$('#back').onclick=()=>nav('home')}
function help(){display(`<span class="eyebrow">🎮 Comment jouer</span><h2>Maîtrise le terrain</h2><div class="tip"><b>Sur iPhone / téléphone</b><br>Glisse ton doigt <b>vers le haut</b> sur l’écran pour sauter.<br>Glisse <b>vers le bas</b> pour te baisser sous les branches.<br>Un appui rapide sur le terrain déclenche aussi un saut.<br>Maintiens ⚡ pour sprinter (cela consomme de l’énergie).<br>Les boutons du bas fonctionnent aussi.<br><br><b>Sur ordinateur</b><br>↑ / Espace : saut · ↓ : se baisser · Maj : sprint · P : pause</div><div class="stats"><span class="stat">🪵 Tronc → saute</span><span class="stat">🌿 Branche → baisse-toi</span><span class="stat">🟫 Boue → saute ou ralentis</span><span class="stat">🪨 Roche → saute</span><span class="stat">🟡 Pièces → collecte</span></div><button class="btn full" id="back">C'est parti !</button>`);$('#back').onclick=()=>nav('home')}
// Relie les bosses, les faux plats et les descentes à une même altitude physique.
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function hill(x,mid,width,height){const t=Math.abs(x-mid)/width;return t>=1?0:height*.5*(1+Math.cos(Math.PI*t))}
function elevation(x,c=COURSES[selected]){const a=c.mode==='mountain'?1.36:c.mode==='night'?1.07:1;let y=a*(29*Math.sin(x*.0025+.4)+15*Math.sin(x*.0062+.5)+6*Math.sin(x*.014));let zone=Math.floor(x/1700);for(let i=zone-1;i<=zone+1;i++){const center=i*1700+820+hash(i,8)*300;const high=55+hash(i,11)*54; y+=hill(x,center,440+hash(i,3)*140,high)}return y}
function slope(x,c){return (elevation(x+20,c)-elevation(x-20,c))/40}
const BIOMES={forest:[{name:'SOUS-BOIS',sky:['#70b8c4','#e5d5ab'],ground:'#4c8b62',soil:'#8e6744',edge:'#c4a47a',trees:['#276344','#358254'],flower:'#f1d7e9'}, {name:'RUISSEAU',sky:['#78c6d0','#e8e6be'],ground:'#518e73',soil:'#8c714b',edge:'#d2b68b',trees:['#246c50','#42866c'],flower:'#e9f5fb'}, {name:'SAPINIÈRE',sky:['#6fa9bc','#bdcfb6'],ground:'#356c55',soil:'#71553d',edge:'#ad8b65',trees:['#1c5641','#315f49'],flower:'#ddd2e2'}],mountain:[{name:'ALPAGE',sky:['#75bbd7','#eaf1d5'],ground:'#8caa69',soil:'#a18a63',edge:'#dcc39a',trees:['#628354','#87a16e'],flower:'#fff2cb'}, {name:'PIERRIER',sky:['#80b8d0','#e2e6d4'],ground:'#8d9b87',soil:'#99836a',edge:'#c9b99d',trees:['#657a65','#839386'],flower:'#ecf3e6'}, {name:'SOMMET',sky:['#eea276','#f8ddae'],ground:'#a4a17a',soil:'#b4936d',edge:'#f2d7a9',trees:['#747e63','#a6a477'],flower:'#fff0b7'}],night:[{name:'CRÉPUSCULE',sky:['#576a97','#d5b0a1'],ground:'#4d776c',soil:'#786558',edge:'#b2a393',trees:['#2b574e','#42675d'],flower:'#b9dbdd'}, {name:'FORÊT NOCTURNE',sky:['#10263a','#31545b'],ground:'#284d46',soil:'#696054',edge:'#a59b83',trees:['#123e39','#286052'],flower:'#82a4a8'}, {name:'CRÊTE SOUS LA LUNE',sky:['#091a35','#31596c'],ground:'#29464b',soil:'#73675c',edge:'#c0b2a0',trees:['#164342','#2b5558'],flower:'#a0c7cc'}]};
function stage(c,x){const i=Math.min(2,Math.floor(clamp(x/c.length,0,.999)*3));return{...BIOMES[c.mode][i],index:i}}
function makeWorld(c){const objects=[],rng=c.difficulty*23;const gap=c.difficulty===1?390:c.difficulty===2?350:315;
 for(let i=0,x=730;x<c.length-260;i++,x+=gap+hash(i,rng)*115){const mode=stage(c,x).name;let roll=hash(i+3,rng+4);let type=roll<.24?'log':roll<.46?'rock':roll<.65?'branch':roll<.85?'mud':'stump';if(mode==='RUISSEAU'&&roll>.74)type='creek';if(mode==='PIERRIER'&&roll>.70)type='rock';if(c.mode==='night'&&roll>.78)type='branch';if(i===0)type='log';objects.push({x,type,done:false,r:type==='branch'?23:type==='creek'?34:27});
  // Le chapelet de pièces a une longueur réelle et ne forme pas de tas en arrivant.
  const start=x-205;for(let j=0;j<5;j++){const cx=start+j*43;if(cx<50||cx>=c.length)continue;const arc=(i%5===2)?(Math.sin(Math.PI*j/4)*75):0;objects.push({x:cx,type:'coin',alt:45+arc,done:false,r:20,value:1})}
  if(i%7===5)objects.push({x:x+165,type:'drink',alt:45,done:false,r:25});
 }
 return objects.sort((a,b)=>a.x-b.x)}
function begin(){const c=COURSES[selected];run={course:c,x:0,elapsed:0,energy:100,hearts:3+profile.levels.shoes,coins:0,objects:makeWorld(c),jumpY:0,vy:0,duck:0,stumble:0,inv:0,paused:false,finished:false,grounded:true,steps:0,stage:-1,preview:false};camX=-W*.29;camHeight=elevation(0,c);keys.boost=false;keys.duck=false;screen='run';$('#modal').classList.remove('on');$('#panel').classList.add('hide');$('#hud').classList.add('on');$('#controls').classList.add('on');$('#courseName').textContent=c.name.toUpperCase();updateHUD();showToast(c.emoji+' '+c.name+' · GO !')}
function updateHUD(){if(!run)return;const c=run.course;$('#distance').textContent=(run.x/c.length*c.km).toFixed(1)+' / '+c.km+' km';$('#progress').style.width=clamp(run.x/c.length*100,0,100)+'%';$('#hearts').textContent='❤️'.repeat(clamp(run.hearts,0,6));$('#energy').style.width=clamp(run.energy,0,100)+'%';$('#energy').style.background=run.energy<25?'#ff8473':'#77ebd3';$('#wallet').textContent='🟡 '+run.coins}
function jump(){if(screen!=='run'||!run||run.paused||run.finished)return;if(run.grounded&&!run.duck){run.vy=545;run.grounded=false;run.jumpY=1;}}
function duck(){if(screen!=='run'||!run||run.paused||run.finished)return;if(run.grounded){run.duck=.9;run.vy=0;}}
function hit(type){if(run.inv>0)return;run.hearts--;run.energy=clamp(run.energy-7,0,100);run.inv=1.2;run.stumble=.5;showToast(({rock:'🪨 Rocher !',log:'🪵 Tronc !',stump:'🌳 Souche !',branch:'🌿 Oups, la branche !',creek:'💦 Bain de pieds !'}[type])||'Aïe !');if(run.hearts<=0)finish(false)}
function collect(o){o.done=true;if(o.type==='coin'){run.coins+=(o.value||1)}else{run.energy=clamp(run.energy+25+profile.levels.gel*15,0,100);showToast('🧃 Ravito : énergie récupérée !')}}
function update(dt){sceneTime+=dt;if(screen!=='run'||!run||run.paused||run.finished)return;const r=run,c=r.course;r.elapsed+=dt;r.inv=Math.max(0,r.inv-dt);r.stumble=Math.max(0,r.stumble-dt);r.duck=Math.max(0,r.duck-dt);
 const steep=slope(r.x,c),sprint=keys.boost&&r.energy>5;let speed=(c.difficulty===1?179:c.difficulty===2?184:190)*(sprint?1.42:1)*(r.stumble>0?.58:1)*(r.energy<10?.73:1);speed*=clamp(1-steep*.48,.74,1.13);r.x+=speed*dt;
 if(!r.grounded){r.jumpY+=r.vy*dt;r.vy-=1180*dt;if(r.jumpY<=0){r.jumpY=0;r.vy=0;r.grounded=true}}
 r.energy=clamp(r.energy-dt*(sprint?1.6:.36)*(1-profile.levels.vest*.17)-Math.max(0,steep)*dt*.8,0,100);
 const st=stage(c,r.x);if(st.index!==r.stage){r.stage=st.index;$('#courseName').textContent=c.name.toUpperCase()+' · '+st.name;if(r.x>100)showToast('🏔️ '+st.name)}
 for(const o of r.objects){if(o.done||o.x<r.x-43||o.x>r.x+43)continue;const dx=Math.abs(o.x-r.x);if(o.type==='coin'||o.type==='drink'){if(dx<25&&Math.abs((r.jumpY+43)-(o.alt||43))<65)collect(o)}else if(dx<24){o.done=true;if(o.type==='mud'){if(r.jumpY<19){r.energy=clamp(r.energy-17,0,100);r.stumble=.8;showToast('🟫 Bourbier — énergie -17')}}else if(o.type==='branch'){if(r.duck<=0)hit('branch')}else if(r.jumpY<30)hit(o.type)}}
 camX=mix(camX,r.x-W*.29,Math.min(1,dt*8));camHeight=mix(camHeight,elevation(r.x,c),Math.min(1,dt*3));r.steps++;if(r.steps%4===0)updateHUD();if(r.x>=c.length)finish(true)}
function finish(win){if(!run||run.finished)return;run.finished=true;screen='results';keys.boost=keys.duck=false;$('#hud').classList.remove('on');$('#controls').classList.remove('on');const r=run,c=r.course,earned=r.coins+(win?20+c.difficulty*20:0);profile.coins+=earned;if(win){profile.wins++;profile.unlocked=Math.max(profile.unlocked,Math.min(2,selected+1));const old=profile.best[c.id];if(!old||r.elapsed<old.time)profile.best[c.id]={time:r.elapsed,coins:r.coins}}save();$('#bank').textContent=fmt(profile.coins);$('#modal').classList.add('on');$('#modal').innerHTML=`<div class="dialog"><div style="font-size:54px">${win?'🏆':'🩹'}</div><span class="eyebrow">${win?'Ligne d’arrivée':'Abandon technique'}</span><h2>${win?'TRAIL TERMINÉ !':'QUADRIS EN PLS'}</h2><p>${win?'Tu as dompté les côtes et évité les racines. Maintenant, place au ravito.':'Ce n’était peut-être pas le bon moment pour tenter un record Strava.'}</p><div class="result"><div><b>${(r.x/c.length*c.km).toFixed(1)}</b><small>km parcourus</small></div><div><b>${fmt(earned)}</b><small>pièces gagnées</small></div><div><b>${Math.floor(r.elapsed/60)}:${String(Math.floor(r.elapsed%60)).padStart(2,'0')}</b><small>chrono arcade</small></div></div><div class="actions"><button class="btn alt" id="resShop">🎒 Boutique</button><button class="btn" id="retry">↻ Rejouer</button></div><button class="btn out full" id="resHome" style="margin-top:10px">Camp de base</button></div>`;$('#resShop').onclick=()=>nav('shop');$('#retry').onclick=begin;$('#resHome').onclick=()=>nav('home')}
function pause(){if(screen!=='run'||!run||run.finished)return;run.paused=!run.paused;keys.boost=false;$('#modal').classList.toggle('on',run.paused);if(run.paused){$('#modal').innerHTML=`<div class="dialog"><div style="font-size:48px">⏸️</div><h2>Pause ravito</h2><p>« Il ne reste qu’une petite bosse » — le plus grand mensonge du trail.</p><button class="btn full" id="resume">▶ Reprendre</button><button class="btn alt full" id="quit" style="margin-top:10px">Abandonner et garder les pièces</button></div>`;$('#resume').onclick=pause;$('#quit').onclick=()=>finish(false)}}
function path(paint){ctx.beginPath();paint()}
function groundY(world){return H*.735-(elevation(world,run?.course||COURSES[selected])-camHeight)}
function biomeColors(){return stage(run?.course||COURSES[selected],run?.x||0)}
function drawBackground(){const c=run?.course||COURSES[selected],st=biomeColors();const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,st.sky[0]);g.addColorStop(.60,st.sky[1]);g.addColorStop(1,st.ground);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const isNight=c.mode==='night'&&(run?.x||0)/c.length>.33;if(isNight){ctx.fillStyle='#e5ece9';ctx.beginPath();ctx.arc(W*.8,H*.16,22,0,7);ctx.fill();for(let i=0;i<52;i++){ctx.globalAlpha=.25+.25*Math.sin(sceneTime*.9+i);ctx.fillStyle='#fff';ctx.fillRect(hash(i,11)*W,hash(i,12)*H*.40,1.6,1.6)}ctx.globalAlpha=1}else{ctx.globalAlpha=.65;ctx.fillStyle='#fff8c7';ctx.beginPath();ctx.arc(W*.8,H*.13,30,0,7);ctx.fill();ctx.globalAlpha=1}
 for(let j=0;j<3;j++){ctx.fillStyle=j===0? '#b8ccc7a9':j===1?'#577e82a0':'#3e6e68b3';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*(.39+j*.07));for(let x=-20;x<=W+30;x+=35){const wx=x+camX*(.08+j*.1);const top=(.35+j*.07)*H+Math.sin(wx*.008+j*4)*H*.072+Math.sin(wx*.023+j)*H*.03;ctx.lineTo(x,top)}ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
 // silhouettes des forêts d'arrière-plan, défilement en parallaxe
 for(let layer=0;layer<2;layer++){const pace=layer===0?.27:.53,spacing=layer===0?74:96,offset=camX*pace;for(let i=-2;i<W/spacing+3;i++){const n=Math.floor(offset/spacing)+i,x=n*spacing-offset+spacing*.5;const yy=H*(layer===0?.665:.715)+Math.sin(n*.97)*10;const h=(layer===0?70:112)*( .8+hash(n,layer)*.7);ctx.fillStyle=layer===0?'#305d5292':'#214f46b8';ctx.beginPath();ctx.moveTo(x,yy-h);ctx.lineTo(x-h*.37,yy);ctx.lineTo(x+h*.37,yy);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(x,yy-h*.7);ctx.lineTo(x-h*.32,yy+8);ctx.lineTo(x+h*.32,yy+8);ctx.closePath();ctx.fill()}}}
function drawGround(){const st=biomeColors(),step=7;ctx.beginPath();ctx.moveTo(-step,H+10);for(let sx=-step;sx<W+step;sx+=step)ctx.lineTo(sx,groundY(camX+sx));ctx.lineTo(W+step,H+10);ctx.closePath();const grad=ctx.createLinearGradient(0,H*.55,0,H);grad.addColorStop(0,st.soil);grad.addColorStop(1,'#342d27');ctx.fillStyle=grad;ctx.fill();
 ctx.strokeStyle=st.edge;ctx.lineWidth=4;ctx.beginPath();for(let sx=-step;sx<W+step;sx+=step){const gy=groundY(camX+sx);if(sx===-step)ctx.moveTo(sx,gy);else ctx.lineTo(sx,gy)}ctx.stroke();
 // Stries de terre, éboulis, marquages et herbes qui défilent avec le coureur.
 for(let i=Math.floor(camX/40)-1;i<Math.ceil((camX+W)/40)+1;i++){const xx=i*40-camX,y=groundY(i*40);if(xx<-20||xx>W+20)continue;ctx.fillStyle=i%3===0?'#1d443342':'#ead0a13b';ctx.beginPath();ctx.ellipse(xx+10,y+10+(hash(i,3)*19),7+hash(i,7)*13,1.7, -.2,0,7);ctx.fill();if(i%2===0){ctx.strokeStyle=i%5===0?'#a8ba66':'#486a41';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx-4,y-7);ctx.moveTo(xx,y);ctx.lineTo(xx+4,y-10);ctx.stroke()}
 if(i%7===0){ctx.fillStyle=st.flower;ctx.beginPath();ctx.arc(xx+3,y-8,2.5,0,7);ctx.fill()}}
 // tronçons en terre boueuse / passerelles / pierriers, purement visuels
 for(let i=Math.floor(camX/750)-1;i<=Math.ceil((camX+W)/750)+1;i++){const wx=i*750+260,kind=i%3,x=wx-camX;if(x<-130||x>W+140)continue;if(kind===0){ctx.strokeStyle='#6d4834';ctx.lineWidth=7;ctx.beginPath();for(let p=0;p<95;p+=8)ctx.lineTo(x+p,groundY(wx+p)+2);ctx.stroke()}else if(kind===1){for(let p=0;p<110;p+=17){ctx.strokeStyle='#b59466';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+p,groundY(wx+p));ctx.lineTo(x+p+13,groundY(wx+p+13));ctx.stroke()}}else{ctx.fillStyle='#847f6e';for(let p=0;p<100;p+=19){ctx.beginPath();ctx.ellipse(x+p,groundY(wx+p)-2,5,2,0,0,7);ctx.fill()}}}}
function drawForeground(){const c=run?.course||COURSES[selected],st=biomeColors();for(let i=Math.floor(camX/125)-1;i<Math.ceil((camX+W)/125)+1;i++){const wx=i*125+hash(i,7)*32,x=wx-camX;if(x<-35||x>W+40)continue;const y=groundY(wx),size=30+hash(i,9)*55,tree=(c.mode!=='mountain'||i%3===0);if(tree){ctx.fillStyle='#60492f';ctx.fillRect(x-4,y-size*.51,8,size*.53);ctx.fillStyle=st.trees[i%2];for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(x,y-size*(1.0-j*.22));ctx.lineTo(x-size*(.28+j*.06),y-size*(.37-j*.1));ctx.lineTo(x+size*(.28+j*.06),y-size*(.37-j*.1));ctx.closePath();ctx.fill()}}else{ctx.fillStyle='#85908b';ctx.beginPath();ctx.moveTo(x-size*.3,y);ctx.lineTo(x-size*.12,y-size*.39);ctx.lineTo(x+size*.2,y-size*.42);ctx.lineTo(x+size*.4,y);ctx.fill()}}}
function drawObstacle(o){const x=o.x-camX,y=groundY(o.x);if(x<-100||x>W+100)return;ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+1,28,5,0,0,7);ctx.fill();if(o.type==='coin'){const yy=y-o.alt+Math.sin(sceneTime*5+o.x)*3;ctx.save();ctx.translate(x,yy);ctx.scale(.78+.22*Math.abs(Math.cos(sceneTime*3+o.x)),1);ctx.fillStyle='#ffd258';ctx.strokeStyle='#fff5b5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#a97327';ctx.font='900 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,0);ctx.restore();return}if(o.type==='drink'){ctx.fillStyle='#7fe2d5';ctx.beginPath();ctx.roundRect(x-9,y-49,18,32,5);ctx.fill();ctx.fillStyle='#dffbf3';ctx.fillRect(x-5,y-54,10,6);return}if(o.type==='rock'){ctx.fillStyle='#758186';ctx.beginPath();ctx.moveTo(x-27,y);ctx.lineTo(x-22,y-23);ctx.lineTo(x-6,y-37);ctx.lineTo(x+16,y-30);ctx.lineTo(x+27,y);ctx.fill();ctx.fillStyle='#adb9b6';ctx.beginPath();ctx.moveTo(x-20,y-23);ctx.lineTo(x-6,y-37);ctx.lineTo(x+8,y-30);ctx.lineTo(x-5,y-16);ctx.fill()}
 else if(o.type==='stump'){ctx.fillStyle='#755337';ctx.fillRect(x-18,y-26,36,26);ctx.fillStyle='#c99e6a';ctx.beginPath();ctx.ellipse(x,y-26,18,7,0,0,7);ctx.fill();ctx.strokeStyle='#805b3a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-26,10,4,0,0,7);ctx.stroke()}
 else if(o.type==='log'){ctx.fillStyle='#795638';ctx.beginPath();ctx.roundRect(x-27,y-22,54,19,8);ctx.fill();ctx.fillStyle='#b58a58';ctx.beginPath();ctx.roundRect(x-23,y-21,42,4,2);ctx.fill();ctx.fillStyle='#d4ab77';ctx.beginPath();ctx.ellipse(x+22,y-12,7,10,0,0,7);ctx.fill()}
 else if(o.type==='branch'){ctx.strokeStyle='#5d422d';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+35,y+3);ctx.lineTo(x+33,y-68);ctx.lineTo(x-33,y-69);ctx.stroke();ctx.strokeStyle='#528458';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x-30,y-68);ctx.lineTo(x-40,y-81);ctx.stroke();ctx.fillStyle='#4b8b58';for(let j=0;j<5;j++){ctx.beginPath();ctx.ellipse(x-38+j*15,y-70+(j%2)*5,13,6,0,0,7);ctx.fill()}}
 else if(o.type==='mud'){ctx.fillStyle='#64442c';ctx.beginPath();ctx.ellipse(x,y-2,39,10,0,0,7);ctx.fill();ctx.fillStyle='#a37949';ctx.beginPath();ctx.ellipse(x-12,y-4,14,4,0,0,7);ctx.fill()}
 else if(o.type==='creek'){ctx.fillStyle='#3a8395';ctx.beginPath();ctx.ellipse(x,y,38,9,0,0,7);ctx.fill();ctx.strokeStyle='#c3e9e8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-32,y-3);ctx.quadraticCurveTo(x,y-13,x+32,y-3);ctx.stroke()}}
// Traileur de profil, genoux articulés. Le bassin suit le relief et le saut est physique.
function drawRunner(){const r=run,c=r?.course||COURSES[selected];const x=(r?.x||0)-camX,y=groundY(r?.x||0)-(r?.jumpY||0),phase=(r?.elapsed||sceneTime)*12.5;const stride=Math.sin(phase),bodyBob=run&&r.grounded&&!r.duck?Math.cos(phase*2)*2.1:0;const crouch=(r?.duck||0)>0;
 ctx.save();ctx.globalAlpha=r?.inv>0&&Math.sin(sceneTime*24)>0?.45:1;ctx.fillStyle='#061a1b63';ctx.beginPath();ctx.ellipse(x,groundY(r?.x||0)+4,25,6,0,0,7);ctx.fill();ctx.translate(x,y+bodyBob);
 if(crouch){ctx.fillStyle='#1a3942';ctx.beginPath();ctx.roundRect(-23,-27,44,20,9);ctx.fill();ctx.strokeStyle='#263942';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,-10);ctx.lineTo(-19,0);ctx.moveTo(9,-10);ctx.lineTo(23,0);ctx.stroke();ctx.fillStyle='#ed965b';ctx.beginPath();ctx.roundRect(-15,-30,31,18,7);ctx.fill();ctx.fillStyle='#e6b38f';ctx.beginPath();ctx.arc(17,-30,10,0,7);ctx.fill();ctx.fillStyle='#b8e36c';ctx.beginPath();ctx.roundRect(8,-42,20,7,4);ctx.fill();ctx.restore();return}
 const swing1=stride*11,swing2=-stride*11;ctx.strokeStyle='#233842';ctx.lineCap='round';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-6,-29);ctx.lineTo(-5+swing1*.60,-14-Math.max(0,swing1)*.35);ctx.lineTo(-8+swing1*.8,0-Math.max(0,swing1)*.40);ctx.moveTo(7,-29);ctx.lineTo(8+swing2*.60,-14-Math.max(0,swing2)*.35);ctx.lineTo(10+swing2*.8,0-Math.max(0,swing2)*.40);ctx.stroke();ctx.fillStyle='#e5efeb';ctx.beginPath();ctx.roundRect(-15+swing1*.8,-3-Math.max(0,swing1)*.40,15,6,3);ctx.roundRect(3+swing2*.8,-3-Math.max(0,swing2)*.40,15,6,3);ctx.fill();
 ctx.strokeStyle='#e3af89';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-10,-61);ctx.lineTo(-19-stride*5,-40);ctx.lineTo(-9-stride*7,-26);ctx.moveTo(11,-61);ctx.lineTo(22+stride*5,-43);ctx.lineTo(17+stride*5,-31);ctx.stroke();ctx.fillStyle='#f09458';ctx.beginPath();ctx.roundRect(-17,-69,34,43,9);ctx.fill();ctx.fillStyle='#284d59';ctx.beginPath();ctx.roundRect(-14,-66,25,32,8);ctx.fill();ctx.strokeStyle='#a6df75';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-12,-66);ctx.lineTo(-12,-36);ctx.moveTo(11,-66);ctx.lineTo(11,-36);ctx.stroke();ctx.fillStyle='#e7b68e';ctx.beginPath();ctx.arc(15,-78,13,0,7);ctx.fill();ctx.fillStyle='#b4e26d';ctx.beginPath();ctx.roundRect(3,-92,26,10,5);ctx.fill();ctx.fillStyle='#1d353c';ctx.beginPath();ctx.arc(21,-78,1.8,0,7);ctx.fill();ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);drawBackground();drawGround();drawForeground();if(run){for(const o of run.objects)if(!o.done&&o.x>camX-90&&o.x<camX+W+90)drawObstacle(o)}drawRunner();if(run?.inv>0&&Math.sin(sceneTime*23)>0){ctx.fillStyle='#ff596120';ctx.fillRect(0,0,W,H)}const c=run?.course||COURSES[selected];if(c.mode==='night'&&(run?.x||0)/c.length>.32){let lvl=profile.levels.lamp,xx=run?run.x-camX:W*.35;const grad=ctx.createRadialGradient(xx,H*.52,H*.13+lvl*15,xx,H*.52,H*.91);grad.addColorStop(0,'#00061600');grad.addColorStop(1,`rgba(1,6,18,${Math.max(.2,.63-lvl*.12)})`);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H)}}
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width||400;H=rect.height||760;DPR=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
function tick(now){if(!last)last=now;const dt=Math.min(.045,(now-last)/1000);last=now;if(!document.hidden)update(dt);render();requestAnimationFrame(tick)}
// Gestes tactiles sur toute la surface du jeu : swipe vertical, tap et boutons.
canvas.addEventListener('pointerdown',e=>{if(screen!=='run'||run?.paused)return;swipe.active=true;swipe.id=e.pointerId;swipe.x=e.clientX;swipe.y=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointerup',e=>{if(!swipe.active||e.pointerId!==swipe.id)return;const dy=e.clientY-swipe.y,dx=e.clientX-swipe.x;swipe.active=false;if(Math.abs(dy)>28&&Math.abs(dy)>Math.abs(dx)*.75){if(dy<0)jump();else duck()}else if(Math.abs(dy)<20&&Math.abs(dx)<30)jump()});
canvas.addEventListener('pointercancel',()=>swipe.active=false);
$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#duck').addEventListener('pointerdown',e=>{e.preventDefault();duck()});
const boostButton=$('#boost');boostButton.addEventListener('pointerdown',e=>{e.preventDefault();keys.boost=true;boostButton.classList.add('active');try{boostButton.setPointerCapture(e.pointerId)}catch(_){}});for(const t of ['pointerup','pointercancel','lostpointercapture'])boostButton.addEventListener(t,()=>{keys.boost=false;boostButton.classList.remove('active')});
$('#pause').onclick=pause;
window.addEventListener('keydown',e=>{if(screen!=='run')return;if(['ArrowUp','ArrowDown',' ','Shift','p','P','Escape','w','s'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')jump();if(e.key==='ArrowDown'||e.key==='s')duck();if(e.key==='Shift')keys.boost=true;if(e.key==='p'||e.key==='P'||e.key==='Escape')pause()});
window.addEventListener('keyup',e=>{if(e.key==='Shift')keys.boost=false});window.addEventListener('blur',()=>{keys.boost=false;if(run&&screen==='run'&&!run.paused)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&screen==='run'&&!run.paused)pause()});window.addEventListener('resize',resize);
resize();nav('home');requestAnimationFrame(tick);
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
