<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">

<title>Trail Chaos — Le jeu de trail</title>
<style>
:root{color-scheme:dark;--lime:#c5f76b;--mint:#62e4c2;--white:#f7f9ef;--muted:#a8b7bd;--bg:#0b1a1f;--panel:#152b32;--line:rgba(255,255,255,.13);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{margin:0;overscroll-behavior:none;height:100%;background:#061419;color:var(--white)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:3px}button:disabled{opacity:.42;cursor:not-allowed}#app{position:relative;margin:auto;width:100%;max-width:560px;height:100dvh;min-height:570px;overflow:hidden;background:linear-gradient(#96d4e7,#36595b);isolation:isolate;box-shadow:0 0 80px #000b}canvas{display:block;width:100%;height:100%;touch-action:none}
#shade{pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,17,25,.78),transparent 27%,transparent 62%,rgba(0,13,17,.7));z-index:1}#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand{font-size:13px;line-height:1.05;letter-spacing:1.5px;font-weight:1000;text-shadow:0 2px 12px #0009}.brand b{display:block;color:var(--lime);font-size:19px;letter-spacing:.5px}.pills{display:flex;gap:6px;align-items:center}.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(7,27,29,.78);border:1px solid #ffffff26;box-shadow:0 5px 20px #0003;padding:9px 11px;border-radius:15px;font-weight:900;font-size:13px;white-space:nowrap;backdrop-filter:blur(8px)}.coin-icon{color:#ffcf46;text-shadow:0 1px #8c6113}.small-btn{background:rgba(7,27,29,.83);border:1px solid #ffffff30;color:#fff;border-radius:13px;min-width:39px;min-height:39px}
#hud{position:absolute;z-index:4;top:73px;left:16px;right:16px;display:none;pointer-events:none}#hud.show{display:block}.hudhead{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:12px;text-shadow:0 1px 7px #000}.track{height:8px;margin-top:7px;background:#0009;border:1px solid #ffffff55;border-radius:12px;overflow:hidden}.track b{height:100%;display:block;width:0;background:linear-gradient(90deg,#52e3be,#d2f874);transition:width .12s linear}.hudstats{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;font-size:13px;font-weight:900;text-shadow:0 2px 6px #000}.stamina{max-width:135px;width:35%;height:9px;overflow:hidden;background:#09191ab0;border:1px solid #ffffff55;border-radius:9px}.stamina b{height:100%;width:100%;display:block;background:#67e6d6}.hud-btn{pointer-events:auto}
#panel{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;padding:70px 19px max(19px,env(safe-area-inset-bottom));pointer-events:none}#panel.hidden{display:none}.screen{pointer-events:auto;border-radius:26px;padding:21px;background:linear-gradient(160deg,rgba(14,40,47,.96),rgba(9,23,30,.97));border:1px solid #ffffff2c;box-shadow:0 18px 48px #0009;backdrop-filter:blur(16px);max-height:min(78dvh,760px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.eyebrow{display:block;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--mint);font-weight:1000}.screen h1{font-size:clamp(29px,8vw,43px);line-height:.95;letter-spacing:-1.7px;margin:8px 0 10px;font-weight:1000}.screen h2{font-size:27px;letter-spacing:-1px;margin:8px 0}.screen h3{margin:10px 0;font-size:16px}.screen p{font-size:13px;line-height:1.55;color:#c8d5d6;margin:8px 0 14px}.screen .muted{font-size:11px;color:var(--muted)}.accent{color:var(--lime)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.button{border:0;background:var(--lime);color:#14251b;font-weight:1000;border-radius:14px;padding:13px 12px;min-height:47px;text-align:center;box-shadow:0 4px 0 #80a13c}.button:active{transform:translateY(2px);box-shadow:0 2px 0 #80a13c}.button.secondary{background:#27434a;color:#eef8ef;box-shadow:none;border:1px solid #ffffff24}.button.outline{background:transparent;border:1px solid #ffffff3b;color:#f0f5f3;box-shadow:none}.button.full{width:100%}.button.slim{min-height:37px;padding:7px 10px;font-size:12px}.button:disabled{box-shadow:none}.courses,.shoplist{display:flex;flex-direction:column;gap:8px;margin:12px 0}.course,.gear{border-radius:15px;padding:12px;background:#ffffff0d;border:1px solid #ffffff1b}.course.active,.gear.active{border-color:var(--lime);background:#d5ff6c12}.course{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}.course strong,.gear strong{font-size:14px;display:block}.course small,.gear small{font-size:11px;color:#b1c1c3}.course .emoji{font-size:23px;min-width:29px}.course .right{font-size:11px;font-weight:900;color:var(--lime)}.gear{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center}.gear .emoji{font-size:28px}.gear button{border-radius:10px;border:0;background:var(--lime);color:#172318;font-weight:900;padding:8px;font-size:11px}.gear button:disabled{background:#637673}.separator{height:1px;background:#ffffff24;margin:15px 0}.statsbox{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.stat{background:#ffffff14;border:1px solid #ffffff20;border-radius:9px;font-size:11px;padding:8px 9px;color:#eaf3ee}.leader{display:flex;justify-content:space-between;align-items:center;gap:8px}#controls{display:none;position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:13px;right:13px;z-index:5;align-items:flex-end;justify-content:space-between;pointer-events:none}#controls.show{display:flex}.control-group{display:flex;gap:9px}.ctl{pointer-events:auto;background:#0b2426b8;border:1px solid #ffffff6b;color:#fff;border-radius:19px;width:66px;height:65px;font-weight:950;font-size:26px;box-shadow:0 5px 25px #0006;backdrop-filter:blur(7px);touch-action:none;user-select:none}.ctl span{display:block;font-size:9px;letter-spacing:.4px;font-weight:800;margin-top:1px}.ctl.move{width:57px}.ctl:active{background:#c6f76bcf;color:#10211c}#toast{pointer-events:none;position:absolute;z-index:6;top:23%;left:50%;transform:translateX(-50%) translateY(7px);background:#0d2527dc;border:1px solid #e1ffae60;border-radius:13px;padding:10px 14px;color:#fff;font-weight:1000;text-align:center;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;font-size:13px;text-shadow:0 1px #000}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.tip{border:1px dashed #a6d8b059;background:#b5e6aa0b;border-radius:12px;padding:10px;font-size:12px;color:#bdd5cf;line-height:1.5}.modalback{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;padding:18px;background:#031014ab;backdrop-filter:blur(8px)}.modalback.show{display:flex}.modal{background:#14282d;border:1px solid #ffffff35;border-radius:24px;padding:23px;box-shadow:0 20px 70px #000b;width:100%;max-width:440px;text-align:center}.modal .big{font-size:60px;line-height:1}.modal h2{font-size:30px;letter-spacing:-1px;margin:12px 0}.modal p{color:#c9d7d6;font-size:13px;line-height:1.5}.modal .resultrow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:15px 0}.resultrow div{background:#ffffff10;border:1px solid #ffffff20;border-radius:11px;padding:11px 3px}.resultrow b{display:block;color:var(--lime);font-size:21px}.resultrow small{color:#c7d8d6;font-size:10px}.desktop{display:none}@media(min-width:750px){.desktop{display:block;position:fixed;right:calc(50% + 300px);top:35%;color:#d1e0d6;max-width:250px}.desktop h2{font-size:37px}.desktop p{line-height:1.6;color:#9fb0ac}}@media(max-height:720px){#panel{padding-bottom:9px}.screen{padding:14px;max-height:76dvh}.screen h1{font-size:32px}.ctl{height:52px;width:57px}.ctl.move{width:51px}.hudstats{margin-top:6px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="desktop"><h2>TRAIL<br>CHAOS <span style="color:#c5f76b">RUNNER</span></h2><p>Le trail, la boue, les ravitos douteux. Mais cette fois, c'est toi qui cours.</p><p>← → changer de voie<br>↑ / espace sauter<br>↓ glisser<br>P pause</p></div>
<div id="app">
<canvas id="game" aria-label="Jeu d'arcade : courir et éviter les obstacles"></canvas>
<div id="shade"></div>
<header id="top"><div class="brand">TRAIL CHAOS <b>RUNNER <span style="font-size:11px;color:#fff">V2</span></b></div><div class="pills"><span class="pill"><span class="coin-icon">●</span> <span id="bank">0</span></span><button class="small-btn" id="audioBtn" title="Activer ou désactiver le son" aria-label="Activer ou désactiver le son">🔇</button></div></header>
<div id="hud"><div class="hudhead"><span id="courseName">FORÊT DES RACINES</span><span id="distance">0 / 8 km</span></div><div class="track"><b id="progress"></b></div><div class="hudstats"><span id="lives">❤️❤️❤️</span><span style="display:flex;align-items:center;gap:6px;flex:1;justify-content:center">⚡<span class="stamina"><b id="stamina"></b></span></span><span id="runCoins">🟡 0</span><button class="small-btn hud-btn" id="pauseBtn" aria-label="Pause" style="width:35px;min-height:35px">Ⅱ</button></div></div>
<main id="panel"></main>
<div id="controls"><div class="control-group"><button id="left" class="ctl move" aria-label="Aller à gauche">←<span>GAUCHE</span></button><button id="right" class="ctl move" aria-label="Aller à droite">→<span>DROITE</span></button></div><div class="control-group"><button id="slide" class="ctl" aria-label="Se baisser">↓<span>GLISSER</span></button><button id="jump" class="ctl" aria-label="Sauter">↑<span>SAUTER</span></button></div></div>
<div id="toast"></div>
<div id="modal" class="modalback"></div>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), canvas=$('#game'), ctx=canvas.getContext('2d'), app=$('#app');
const COURSES=[{id:'forest',name:'Forêt des Racines',emoji:'🌲',distance:8,units:970,mode:'Forêt',desc:'Boue, troncs et papy qui double.',difficulty:1},{id:'crest',name:'Crêtes du Vent',emoji:'⛰️',distance:21,units:1520,mode:'Montagne',desc:'Rochers, vent et quadriceps en PLS.',difficulty:2},{id:'night',name:'Ultra Nocturne',emoji:'🌙',distance:45,units:2100,mode:'Nuit',desc:'Frontale, racines et regrets.',difficulty:3}];
const SHOP=[{id:'shoes',emoji:'👟',name:'Chaussures de trail',desc:['Semelles du dimanche','Crampons sérieux','Accroche de bouquetin','Adhérence de légende'],prices:[0,35,90,170],buff:'Ajoute un cœur de résistance par niveau.'},{id:'vest',emoji:'🎒',name:'Gilet de trail',desc:['Poches imaginaires','Deux flasques','Ravito premium','Autonomie d’ultra'],prices:[0,30,75,145],buff:'L’énergie baisse moins vite en course.'},{id:'gel',emoji:'🍯',name:'Gels énergétiques',desc:['Goût dentifrice','Banane douteuse','Carburant de champion','Turbo ravito'],prices:[0,25,65,125],buff:'Récupère davantage d’énergie aux ravitos.'},{id:'lamp',emoji:'🔦',name:'Frontale',desc:['Lampe de poche','Éclairage correct','Pleine puissance','Phare de stade'],prices:[0,25,60,115],buff:'Améliore la visibilité sur le parcours de nuit.'}];
const DEFAULT={coins:0,levels:{shoes:0,vest:0,gel:0,lamp:0},unlocked:0,wins:0,best:{},sound:false};
let saved;try{saved=JSON.parse(localStorage.getItem('trail-chaos-runner-v2')||'null')}catch(_){};
let profile={...DEFAULT,...(saved&&typeof saved==='object'?saved:{}),levels:{...DEFAULT.levels,...(saved?.levels||{})}};
const persist=()=>{try{localStorage.setItem('trail-chaos-runner-v2',JSON.stringify(profile))}catch(_){}};
const fmt=v=>Math.floor(v).toLocaleString('fr-FR');let selected=0,screen='home',run=null,sceneTime=0,lastTime=0,toastTimeout=0,audio=null,W=400,H=750,DPR=1;let touchStart=null;
const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const lerp=(a,b,t)=>a+(b-a)*t;
function chirp(freq=680,duration=.08,type='sine',vol=.06){if(!profile.sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*.6),audio.currentTime+duration);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(_){}}
function uiCoin(){ $('#bank').textContent=fmt(profile.coins);$('#audioBtn').textContent=profile.sound?'🔊':'🔇' }
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),1350)}
function screenHTML(content){$('#panel').innerHTML=`<section class="screen">${content}</section>`;$('#panel').classList.remove('hidden');$('#hud').classList.remove('show');$('#controls').classList.remove('show');$('#modal').classList.remove('show');uiCoin()}
function nav(to){screen=to;if(to==='home')home();else if(to==='courses')courses();else if(to==='shop')shop();else if(to==='help')help()}
function home(){const c=COURSES[selected];screenHTML(`<span class="eyebrow">🏁 Ta carrière de traileur</span><h1>COURIR.<br><span class="accent">SURVIVRE.</span><br>RECOMMENCER.</h1><p>Saute les troncs, glisse sous les branches et esquive les rochers. Garde un œil sur ton énergie et surtout… ramasse les pièces !</p><div class="statsbox"><span class="stat">🏆 ${profile.wins} arrivée(s)</span><span class="stat">👟 Niveau ${profile.levels.shoes+1}</span><span class="stat">🟡 ${fmt(profile.coins)} pièces</span></div><div class="course active" id="quickCourse"><span class="emoji">${c.emoji}</span><div style="flex:1"><strong>${c.name}</strong><small>${c.distance} km · Mode arcade accéléré</small></div><span class="right">CHANGER ›</span></div><button class="button full" id="go" style="margin-top:9px">▶ PARTIR SUR LE SENTIER</button><div class="actions" style="margin-top:10px"><button class="button secondary" id="shopBtn">🎒 Boutique</button><button class="button secondary" id="helpBtn">🎮 Comment jouer</button></div><p class="muted" style="margin-bottom:0;text-align:center">Une vraie partie, sans choix à cocher. Tes réflexes font le chrono.</p>`);$('#quickCourse').onclick=()=>nav('courses');$('#go').onclick=()=>start();$('#shopBtn').onclick=()=>nav('shop');$('#helpBtn').onclick=()=>nav('help')}
function courses(){screenHTML(`<span class="eyebrow">🗺️ Choisis ton parcours</span><h2>Les sentiers</h2><p>Trois ambiances, des obstacles de plus en plus corsés. Termine un parcours pour débloquer le suivant.</p><div class="courses">${COURSES.map((c,i)=>`<div class="course ${i===selected?'active':''}" data-course="${i}" style="opacity:${i>profile.unlocked?.52:1}"><span class="emoji">${i>profile.unlocked?'🔒':c.emoji}</span><div style="flex:1"><strong>${c.name}</strong><small>${c.distance} km · ${c.desc}</small></div><span class="right">${i>profile.unlocked?'BLOQUÉ':i===selected?'✓ CHOISI':'CHOISIR'}${profile.best[c.id]?' · 🏁':''}</span></div>`).join('')}</div><div class="actions"><button class="button secondary" id="back">← Retour</button><button class="button" id="go">▶ Courir</button></div>`);document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{let i=+b.dataset.course;if(i>profile.unlocked){toast('Termine d’abord le parcours précédent 🔒');return}selected=i;courses()});$('#back').onclick=()=>nav('home');$('#go').onclick=()=>start()}
function shop(){screenHTML(`<span class="eyebrow">🛒 Achats indispensables (ou presque)</span><div class="leader"><h2>La boutique</h2><span class="pill">🟡 ${fmt(profile.coins)}</span></div><p>Tes pièces servent vraiment : davantage de cœurs, moins de fatigue, meilleurs ravitos et meilleure visibilité nocturne.</p><div class="shoplist">${SHOP.map(g=>{let l=profile.levels[g.id],max=l>=3,cost=g.prices[l+1];return `<div class="gear"><span class="emoji">${g.emoji}</span><div><strong>${g.name} <span class="accent">Niv. ${l+1}/4</span></strong><small>${g.desc[l]}</small><div class="muted">${g.buff}</div></div><button data-buy="${g.id}" ${max||profile.coins<cost?'disabled':''}>${max?'MAX':`🟡 ${cost}`}</button></div>`}).join('')}</div><button class="button secondary full" id="back">← Retour au camp de base</button>`);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=b.dataset.buy,g=SHOP.find(x=>x.id===id),l=profile.levels[id],cost=g.prices[l+1];if(l>=3||profile.coins<cost)return;profile.coins-=cost;profile.levels[id]++;persist();chirp(760,.17);toast('Équipement amélioré !');shop()});$('#back').onclick=()=>nav('home')}
function help(){screenHTML(`<span class="eyebrow">🎮 Guide de survie</span><h2>Apprends à esquiver</h2><div class="tip"><b>📱 Sur téléphone</b><br>Glisse ← ou → pour changer de couloir.<br>Glisse ↑ pour sauter et ↓ pour te baisser.<br>Tu peux aussi utiliser les boutons à l'écran.<br><br><b>⌨️ Sur ordinateur</b><br>Flèches gauche/droite · ↑ ou Espace · ↓ · P pour pause.</div><div class="statsbox"><span class="stat">🪵 Tronc → SAUTE</span><span class="stat">🌿 Branche → GLISSE</span><span class="stat">🪨 Rocher → ESQUIVE</span><span class="stat">🟡 Pièces → COLLECTE</span></div><p>Plus tu prends d'obstacles, plus tu perds des cœurs. L’énergie baisse en courant : attrape les ravitos 🧃 ou augmente le niveau de ton gilet.</p><button class="button full" id="back">C'est parti !</button>`);$('#back').onclick=()=>nav('home')}
function start(){const c=COURSES[selected];screen='running';run={course:c,elapsed:0,dist:0,lane:1,visualLane:1,objects:[],spawn:1,hearts:3+profile.levels.shoes,energy:100,coins:0,jump:0,slide:0,invul:0,stumble:0,paused:false,finished:false,checkpoint:0,score:0,trackOffset:0,flashes:[],steps:0};$('#panel').classList.add('hidden');$('#hud').classList.add('show');$('#controls').classList.add('show');$('#courseName').textContent=c.name.toUpperCase();updateHUD();toast(c.emoji+' '+c.name+' — GO !');chirp(630,.18)}
function updateHUD(){if(!run)return;$('#distance').textContent=`${(run.dist/run.course.units*run.course.distance).toFixed(1)} / ${run.course.distance} km`;$('#progress').style.width=`${clamp(run.dist/run.course.units*100,0,100)}%`;$('#lives').textContent='❤️'.repeat(clamp(run.hearts,0,7));$('#stamina').style.width=`${clamp(run.energy,0,100)}%`;$('#stamina').style.background=run.energy<25?'#ff807b':'#67e6d6';$('#runCoins').textContent=`🟡 ${run.coins}`}
function move(d){if(screen!=='running'||!run||run.paused)return;const next=clamp(run.lane+d,0,2);if(next!==run.lane){run.lane=next;chirp(320,.055,'triangle',.024)}}
function jump(){if(screen!=='running'||!run||run.paused)return;if(run.jump<=0&&run.slide<=0){run.jump=.83;chirp(480,.11,'triangle',.04)}}
function slide(){if(screen!=='running'||!run||run.paused)return;if(run.slide<=0&&run.jump<=0){run.slide=.87;chirp(260,.12,'sawtooth',.026)}}
function jumpHeight(){if(!run||run.jump<=0)return 0;return Math.sin(Math.PI*(1-run.jump/.83))*84}
function newObj(type,lane,z){run.objects.push({type,lane,z,resolved:false,twinkle:rand(0,6)})}
function spawnWave(){const difficulty=run.course.difficulty,progress=run.dist/run.course.units,types=['rock','log','branch'];if(difficulty>=2)types.push('rock','log');if(difficulty===3)types.push('branch');const lanes=[0,1,2].sort(()=>Math.random()-.5);const unsafe=Math.random() <(.12+difficulty*.12+progress*.08)?2:1;const z=139;for(let n=0;n<unsafe;n++){let typ=types[Math.floor(Math.random()*types.length)];newObj(typ,lanes[n],z+rand(-1.5,1.5))}
let safe=lanes[unsafe];for(let i=0;i<4;i++)newObj('coin',safe,z+13+i*12);
if(Math.random()<.24){let foodLane=lanes[Math.floor(Math.random()*3)];newObj('drink',foodLane,z+42)}
if(Math.random()<.22)newObj('coin',lanes[1],z+49)}
function strike(obj){if(run.invul>0)return;run.hearts--;run.invul=1.45;run.stumble=.43;run.energy=clamp(run.energy-7,0,100);run.flashes.push({t:.5,type:'hit'});chirp(150,.3,'sawtooth',.12);const messages={rock:'🪨 Caillou 1 — Tibia 0',log:'🪵 Le tronc a gagné',branch:'🌿 La branche ne s’est pas baissée'};toast(messages[obj.type]||'Aïe !');if(run.hearts<=0)end(false)}
function collect(obj){obj.resolved=true;if(obj.type==='coin'){run.coins+=1;run.score+=10;chirp(910,.055,'sine',.035);if(run.coins%10===0)toast('🟡 +10 pièces !')}if(obj.type==='drink'){run.energy=clamp(run.energy+24+profile.levels.gel*16,0,100);run.score+=25;chirp(650,.16,'triangle');toast('🧃 Ravito ! Énergie rechargée')}}
function update(dt){sceneTime+=dt;if(screen!=='running'||!run||run.paused||run.finished)return;run.elapsed+=dt;run.visualLane=lerp(run.visualLane,run.lane,Math.min(1,dt*11));run.jump=Math.max(0,run.jump-dt);run.slide=Math.max(0,run.slide-dt);run.invul=Math.max(0,run.invul-dt);run.stumble=Math.max(0,run.stumble-dt);run.flashes=run.flashes.filter(f=>(f.t-=dt)>0);
const pace=22+run.course.difficulty*1.8;const speed=pace*(run.stumble>0?.48:1)*(run.energy<=0?.74:1);const moved=speed*dt;run.dist+=moved;run.trackOffset+=moved;run.energy=Math.max(0,run.energy-moved*(.10-run.course.difficulty*.002)*(1-profile.levels.vest*.19));
run.spawn-=dt;if(run.spawn<=0){spawnWave();run.spawn=rand(1.12,1.55)*(1-(run.course.difficulty-1)*.1)*(1-Math.min(.13,run.dist/run.course.units*.12))}
for(const o of run.objects){let old=o.z;o.z-=moved;if(!o.resolved&&old>=26&&o.z<26){o.resolved=true;if(o.lane===run.lane){if(o.type==='coin'||o.type==='drink'){o.resolved=false;collect(o)}else if(!(o.type==='log'&&jumpHeight()>28)&&!(o.type==='branch'&&run.slide>.07))strike(o)}}}
run.objects=run.objects.filter(o=>o.z>-12);run.steps++;if(Math.floor(run.dist/260)>run.checkpoint){run.checkpoint=Math.floor(run.dist/260);run.energy=clamp(run.energy+8+profile.levels.gel*5,0,100);toast('🏕️ Point de ravito — + énergie !')}
if(run.dist>=run.course.units)end(true);if(run.steps%4===0)updateHUD()}
function end(win){if(!run||run.finished)return;run.finished=true;screen='results';$('#hud').classList.remove('show');$('#controls').classList.remove('show');const c=run.course;const earned=run.coins+(win?20+c.difficulty*15:0);profile.coins+=earned;if(win){profile.wins++;profile.unlocked=Math.max(profile.unlocked,Math.min(2,selected+1));let old=profile.best[c.id];if(!old||run.elapsed<old.time)profile.best[c.id]={time:run.elapsed,coins:run.coins}}persist();uiCoin();$('#modal').classList.add('show');$('#modal').innerHTML=`<div class="modal"><div class="big">${win?'🏆':'🩹'}</div><span class="eyebrow">${win?'Ligne d’arrivée franchie !':'Abandon technique'}</span><h2>${win?'TRAIL TERMINÉ !':'QUADRIS EN PLS'}</h2><p>${win?'Tu as survécu aux racines, aux cailloux et à ton ego.':'Même Kilian a le droit à une mauvaise journée. Tes pièces restent acquises !'}</p><div class="resultrow"><div><b>${(Math.min(1,run.dist/c.units)*c.distance).toFixed(1)}</b><small>km parcourus</small></div><div><b>${fmt(earned)}</b><small>pièces gagnées</small></div><div><b>${Math.floor(run.elapsed/60)}:${String(Math.floor(run.elapsed%60)).padStart(2,'0')}</b><small>temps arcade</small></div></div><div class="actions"><button class="button secondary" id="resShop">🎒 Boutique</button><button class="button" id="resAgain">↻ Rejouer</button></div><button class="button outline full" id="resHome" style="margin-top:9px">Retour au camp</button></div>`;$('#resShop').onclick=()=>nav('shop');$('#resAgain').onclick=()=>start();$('#resHome').onclick=()=>nav('home');chirp(win?820:230,.3,'triangle')}
function pause(){if(screen!=='running'||!run||run.finished)return;run.paused=!run.paused;$('#modal').classList.toggle('show',run.paused);if(run.paused){$('#modal').innerHTML=`<div class="modal"><div class="big">⏸️</div><h2>Pause ravito</h2><p>« Plus que 500 mètres jusqu’au sommet »…<br>— le plus gros mensonge du trail.</p><button class="button full" id="resume">▶ Reprendre la course</button><button class="button secondary full" id="quit" style="margin-top:10px">Abandonner et garder mes pièces</button></div>`;$('#resume').onclick=pause;$('#quit').onclick=()=>end(false)}}
function mountain(points,color,at,parallax){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,at);for(let i=0;i<=points;i++){let x=i*W/points;let y=at- (Math.sin(i*2.7+parallax)*.5+.5)*H*.16-((i%3===1)?H*.06:0);ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
function shadeColor(hex,alpha){ctx.globalAlpha=alpha;ctx.fillStyle=hex}
function background(){const mode=run?.course.mode||COURSES[selected].mode;const night=mode==='Nuit',crest=mode==='Montagne';let sky=ctx.createLinearGradient(0,0,0,H);if(night){sky.addColorStop(0,'#071423');sky.addColorStop(.5,'#183d51');sky.addColorStop(1,'#315d59')}else if(crest){sky.addColorStop(0,'#6ab9d0');sky.addColorStop(.6,'#c4e1d4');sky.addColorStop(1,'#8aae83')}else{sky.addColorStop(0,'#6bc1c7');sky.addColorStop(.65,'#b6dbbc');sky.addColorStop(1,'#5d9f6b')}ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
const par=sceneTime*.07;if(night){ctx.fillStyle='#dde8dd';ctx.beginPath();ctx.arc(W*.76,H*.12,23,0,Math.PI*2);ctx.fill();for(let i=0;i<36;i++){const x=((i*93.61)%W),y=((i*29.63)%(H*.31));ctx.globalAlpha=.35+.3*Math.sin(sceneTime*2+i);ctx.fillRect(x,y,1.5,1.5)}ctx.globalAlpha=1}else{ctx.fillStyle='#fff9bd';ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(W*.8,H*.12,32,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
mountain(12,night?'#254e58':crest?'#73999d':'#729da0',H*.38,par*.3);mountain(13,night?'#1e4046':crest?'#557b7d':'#468481',H*.47,par*.45);mountain(12,night?'#173a3b':crest?'#456955':'#39775c',H*.55,par*.65);ctx.fillStyle=night?'#193d33':crest?'#4c7956':'#357b52';ctx.fillRect(0,H*.55,W,H*.45);
for(let i=0;i<18;i++){const factor=i/18,x=i%2===0? W*.08+factor*W*.4:W*.94-factor*W*.4;const y=H*(.44+factor*.5),size=10+factor*66;tree(x+Math.sin(sceneTime*.25+i)*3,y,size,night?'#10332d':crest?'#2e6248':'#215a43',.75)} }
function tree(x,y,h,color,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle='#473f2c';ctx.fillRect(x-h*.055,y-h*.15,h*.11,h*.22);ctx.fillStyle=color;for(let k=0;k<3;k++){const yy=y-h*(.85-k*.22);const ww=h*(.26+k*.085);ctx.beginPath();ctx.moveTo(x,yy-h*.28);ctx.lineTo(x-ww,yy+h*.18);ctx.lineTo(x+ww,yy+h*.18);ctx.fill()}ctx.globalAlpha=1}
function centerAt(t){return W*.5+Math.sin(sceneTime*.19+t*2.2)*W*.027*(1-t)+Math.sin((run?.trackOffset||0)*.004+t*3.8)*W*.06*t}
function proj(t,lane=1){t=clamp(t,0,1.08);const y=lerp(H*.34,H*1.08,Math.pow(t,1.58));const half=lerp(W*.045,W*.53,Math.pow(t,1.22));const x=centerAt(t)+(lane-1)*half*(2/3);return{x,y,half,s:lerp(.12,1.45,Math.pow(t,1.7))}}
function path(){const nighttime=run?.course.mode==='Nuit',mountain=run?.course.mode==='Montagne';ctx.beginPath();for(let i=0;i<=22;i++){let p=proj(i/22);ctx.lineTo(centerAt(i/22)-p.half,p.y)}for(let i=22;i>=0;i--){let p=proj(i/22);ctx.lineTo(centerAt(i/22)+p.half,p.y)}ctx.closePath();ctx.fillStyle=nighttime?'#6c6659':mountain?'#aa9873':'#a67e53';ctx.fill();ctx.strokeStyle=nighttime?'#b6a77e':'#d5b18a';ctx.lineWidth=2;ctx.stroke();
for(let j=0;j<3;j++){const max=24;for(let i=0;i<max;i++){let t1=((i/max+((run?.trackOffset||sceneTime*16)*.008)%1)%1),t2=Math.min(1,t1+.035);if(t1<.02)continue;let p=proj(t1,j),p2=proj(t2,j);ctx.globalAlpha=.08+.14*t1;ctx.strokeStyle='#fff6cc';ctx.lineWidth=lerp(.6,4,t1);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}}ctx.globalAlpha=1;
for(let i=0;i<32;i++){const t=(i/32+((run?.trackOffset||sceneTime*10)*.004)%1)%1,p=proj(t),side=i%2===0?-1:1;const x=centerAt(t)+side*(p.half+5+p.s*10);if(t>.1){const r=p.s*2.3;ctx.fillStyle=i%3?'#557d4d':'#426f50';ctx.beginPath();ctx.ellipse(x,p.y,r*1.9,r,0,0,7);ctx.fill()}}}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawItem(o){const t=1-o.z/140;if(t<0||t>1.11)return;const p=proj(t,o.lane),s=p.s,x=p.x,y=p.y;if(o.type==='coin'){const cy=y-30*s+Math.sin(sceneTime*6+o.twinkle)*5*s;ctx.save();ctx.translate(x,cy);ctx.scale(.75+Math.abs(Math.cos(sceneTime*3+o.twinkle))*.25,1);ctx.fillStyle='#fbd95d';ctx.strokeStyle='#fff3a5';ctx.lineWidth=2*s;ctx.beginPath();ctx.arc(0,0,13*s,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#9a6922';ctx.font=`900 ${14*s}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,0);ctx.restore();return}if(o.type==='drink'){ctx.fillStyle='#a5eced';rounded(x-10*s,y-38*s,20*s,29*s,4*s,'#62cdd0');rounded(x-6*s,y-42*s,12*s,7*s,2*s,'#e8f9f4');ctx.fillStyle='#fff';ctx.font=`${14*s}px system-ui`;ctx.textAlign='center';ctx.fillText('⚡',x,y-17*s);return}
ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+2*s,25*s,6*s,0,0,7);ctx.fill();if(o.type==='rock'){ctx.fillStyle='#566a71';ctx.beginPath();ctx.moveTo(x-27*s,y);ctx.lineTo(x-22*s,y-22*s);ctx.lineTo(x-7*s,y-35*s);ctx.lineTo(x+15*s,y-31*s);ctx.lineTo(x+29*s,y-9*s);ctx.lineTo(x+24*s,y+1*s);ctx.closePath();ctx.fill();ctx.fillStyle='#819196';ctx.beginPath();ctx.moveTo(x-20*s,y-20*s);ctx.lineTo(x-7*s,y-35*s);ctx.lineTo(x+5*s,y-30*s);ctx.lineTo(x-6*s,y-10*s);ctx.closePath();ctx.fill()}else if(o.type==='log'){ctx.save();ctx.translate(x,y-12*s);ctx.rotate(.05);rounded(-35*s,-11*s,70*s,22*s,9*s,'#70513a');rounded(-33*s,-8*s,65*s,5*s,3*s,'#aa7b4e');ctx.fillStyle='#d8aa74';ctx.beginPath();ctx.ellipse(31*s,0,8*s,11*s,0,0,7);ctx.fill();ctx.strokeStyle='#80593a';ctx.lineWidth=1.6*s;ctx.beginPath();ctx.ellipse(31*s,0,4*s,6*s,0,0,7);ctx.stroke();ctx.restore()}else if(o.type==='branch'){const hh=87*s;ctx.strokeStyle='#523f2a';ctx.lineWidth=10*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-29*s,y+2*s);ctx.lineTo(x-24*s,y-hh);ctx.quadraticCurveTo(x,y-hh-17*s,x+33*s,y-hh+9*s);ctx.stroke();ctx.strokeStyle='#77a35c';ctx.lineWidth=4*s;ctx.beginPath();ctx.moveTo(x-24*s,y-hh);ctx.lineTo(x-40*s,y-hh-17*s);ctx.moveTo(x+13*s,y-hh-9*s);ctx.lineTo(x+28*s,y-hh-23*s);ctx.stroke();ctx.fillStyle='#5c9953';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(x+(-27+i*17)*s,y-hh+(-11+(i%2)*14)*s,10*s,5*s,(i%2?-.6:.6),0,7);ctx.fill()}} }
function character(lane=1,anim=true){const pos=proj(.79,lane),scale=1.23,x=pos.x,y=pos.y;const lev=(run&&screen==='running'&&!run.paused)?jumpHeight():0;let sliding=run&&run.slide>0,walk=(run?.elapsed||sceneTime)*12,bob=(anim&&!sliding?Math.sin(walk)*3:0);ctx.save();ctx.globalAlpha=run?.invul>0&&Math.sin(sceneTime*25)>0?.44:1;ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(x,y+7,30,10,0,0,7);ctx.fill();ctx.translate(x,y-lev+bob);if(sliding){ctx.translate(0,4);ctx.fillStyle='#dc8146';rounded(-27,-23,49,19,8,'#e58a53');ctx.fillStyle='#193f45';rounded(-35,-11,70,14,7,'#203f48');ctx.fillStyle='#efb58a';ctx.beginPath();ctx.arc(25,-22,11,0,7);ctx.fill();rounded(23,-34,15,8,4,'#c5f76b');ctx.restore();return}
ctx.strokeStyle='#20313a';ctx.lineWidth=8;ctx.lineCap='round';let swing=Math.sin(walk)*13;ctx.beginPath();ctx.moveTo(-8,-19);ctx.lineTo(-11+swing,y>0?2:2);ctx.moveTo(8,-19);ctx.lineTo(10-swing,2);ctx.stroke();ctx.fillStyle='#c6f76b';rounded(-20,-4,21,7,3,'#c6f76b');rounded(0,-4,21,7,3,'#c6f76b');ctx.strokeStyle='#efb58a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-17,-48);ctx.lineTo(-24-swing*.3,-25);ctx.moveTo(17,-48);ctx.lineTo(24+swing*.3,-25);ctx.stroke();rounded(-18,-65,36,42,8,'#f28d50');rounded(12,-56,13,32,5,'#416c5f');ctx.fillStyle='#e9b78e';ctx.beginPath();ctx.arc(0,-74,14,0,7);ctx.fill();rounded(-17,-90,34,10,6,'#c4f269');rounded(0,-85,24,4,2,'#c4f269');ctx.fillStyle='#183733';ctx.beginPath();ctx.arc(-4,-75,1.7,0,7);ctx.fill();ctx.restore()}
function gameDraw(){ctx.clearRect(0,0,W,H);background();path();if(run?.objects?.length){run.objects.slice().sort((a,b)=>b.z-a.z).forEach(o=>{if(!o.resolved||o.z>25&&o.type!=='coin')drawItem(o)})}character(run?run.visualLane:1);if(run?.flashes?.length){ctx.fillStyle='rgba(255,63,66,.2)';ctx.fillRect(0,0,W,H)}if(run?.course.mode==='Nuit'){let level=profile.levels.lamp;let max=.78-level*.14;const x=run?proj(.79,run.visualLane).x:W*.5,y=H*.78;let grd=ctx.createRadialGradient(x,y,70+level*45,x,y,Math.max(W,H)*.78);grd.addColorStop(0,'#010c1300');grd.addColorStop(1,`rgba(2,7,18,${max})`);ctx.fillStyle=grd;ctx.fillRect(0,0,W,H)}}
function resize(){let rect=canvas.getBoundingClientRect();W=rect.width||400;H=rect.height||700;DPR=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
function tick(now){if(!lastTime)lastTime=now;let dt=Math.min(.045,(now-lastTime)/1000);lastTime=now;if(!document.hidden){update(dt);gameDraw()}requestAnimationFrame(tick)}
$('#left').onclick=()=>move(-1);$('#right').onclick=()=>move(1);$('#jump').onclick=jump;$('#slide').onclick=slide;$('#pauseBtn').onclick=pause;$('#audioBtn').onclick=()=>{profile.sound=!profile.sound;persist();uiCoin();chirp(550)};
canvas.addEventListener('pointerdown',e=>{if(screen!=='running'||run?.paused)return;touchStart={x:e.clientX,y:e.clientY,time:performance.now()}});canvas.addEventListener('pointerup',e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25){jump();return}if(Math.abs(dx)>Math.abs(dy)){move(dx<0?-1:1)}else if(dy<0){jump()}else{slide()}});canvas.addEventListener('pointercancel',()=>touchStart=null);
window.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','p','Escape'].includes(e.key))return;if(screen==='running'){e.preventDefault();if(e.repeat)return;switch(e.key){case'ArrowLeft':case'a':move(-1);break;case'ArrowRight':case'd':move(1);break;case'ArrowUp':case'w':case' ':jump();break;case'ArrowDown':case's':slide();break;case'p':case'Escape':pause();break}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='running'&&run&&!run.paused)pause()});window.addEventListener('resize',resize);resize();nav('home');requestAnimationFrame(tick);
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
